# YAML lint config — blocking gate in CI (`yamllint .`) and `make lint`.
extends: default
rules:
  line-length:
    max: 140
    level: warning
  document-start: disable
  truthy:
    check-keys: false # allow GitHub Actions `on:` key
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  indentation:
    spaces: 2
    indent-sequences: consistent
  empty-lines:
    max: 1
ignore: |
  node_modules/
  build/
  "*.local.yaml"
