# Juiced Horizon — the shared theme for the Juiced dashboard.
#
# Semantic design tokens (surface / text / brand / status) mapped onto Home Assistant's core
# CSS variables, with both dark and light modes so OS light/dark switching applies cleanly.
# Views reference the theme with `theme: Juiced Horizon`; cards should use the juiced-* tokens
# and native HA variables instead of hard-coded colours (this is what lets us retire card-mod).
#
# Deploy: load via `frontend: themes: !include_dir_merge_named themes/` on the HA host, or copy
# into the dashboard's themes dir (same pattern as the Kia "Nebula" dashboard). Contrast for the
# text/surface pairs targets WCAG AA (>= 4.5:1 for body text).
Juiced Horizon:
  # ---- mode-independent design tokens ----
  ha-card-border-radius: "18px"
  juiced-radius-sm: "10px"
  juiced-radius-lg: "24px"
  juiced-space: "12px"

  modes:
    dark:
      # core Home Assistant surfaces
      primary-background-color: "#0f1115"
      secondary-background-color: "#171a21"
      card-background-color: "#20242d"
      ha-card-background: "#20242d"
      divider-color: "#343a46"
      ha-card-box-shadow: "0 18px 44px rgba(0, 0, 0, 0.32)"
      # text
      primary-text-color: "#f4f6f8"
      secondary-text-color: "#b7c0cc"
      disabled-text-color: "#6f7885"
      # brand / interaction
      primary-color: "#5cc8ff"
      accent-color: "#7ee787"
      # semantic juiced tokens
      juiced-surface-base: "#0f1115"
      juiced-surface-raised: "#20242d"
      juiced-surface-elevated: "#2b303a"
      juiced-surface-overlay: "rgba(15, 17, 21, 0.88)"
      juiced-border-subtle: "#343a46"
      juiced-text-primary: "#f4f6f8"
      juiced-text-secondary: "#b7c0cc"
      juiced-text-muted: "#8a94a3"
      juiced-text-inverse: "#081018"
      juiced-brand-primary: "#5cc8ff"
      juiced-brand-secondary: "#7ee787"
      juiced-brand-accent: "#ffd166"
      juiced-status-ok: "#7ee787"
      juiced-status-info: "#5cc8ff"
      juiced-status-warning: "#ffd166"
      juiced-status-critical: "#ff6b6b"
      juiced-status-offline: "#6f7885"

    light:
      # core Home Assistant surfaces
      primary-background-color: "#eef1f5"
      secondary-background-color: "#e4e8ee"
      card-background-color: "#ffffff"
      ha-card-background: "#ffffff"
      divider-color: "#d4dae2"
      ha-card-box-shadow: "0 10px 30px rgba(15, 17, 21, 0.10)"
      # text
      primary-text-color: "#0f1115"
      secondary-text-color: "#3a4351"
      disabled-text-color: "#8a94a3"
      # brand / interaction
      primary-color: "#0277bd"
      accent-color: "#2e7d43"
      # semantic juiced tokens
      juiced-surface-base: "#eef1f5"
      juiced-surface-raised: "#ffffff"
      juiced-surface-elevated: "#f6f8fb"
      juiced-surface-overlay: "rgba(244, 246, 248, 0.92)"
      juiced-border-subtle: "#d4dae2"
      juiced-text-primary: "#0f1115"
      juiced-text-secondary: "#3a4351"
      juiced-text-muted: "#6f7885"
      juiced-text-inverse: "#f4f6f8"
      juiced-brand-primary: "#0277bd"
      juiced-brand-secondary: "#2e7d43"
      juiced-brand-accent: "#b26a00"
      juiced-status-ok: "#2e7d43"
      juiced-status-info: "#0277bd"
      juiced-status-warning: "#b26a00"
      juiced-status-critical: "#c62828"
      juiced-status-offline: "#8a94a3"
