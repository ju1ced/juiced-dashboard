# Shared decluttering templates (committed; logical placeholders only — no real IDs).
# 'global_navigation_badges' is the shared navigation badge used by every view.
# Real entity IDs for the placeholder keys live in the git-ignored entities.local.yaml.
global_navigation_badges:
  card:
    type: custom:mushroom-chips-card
    chips:
    - type: back
    - type: entity
      entity: <<nav.home_button>>
      tap_action:
        action: navigate
        navigation_path: home
      name: Home
      content_info: name
      use_entity_picture: true
    - type: entity
      entity: <<energy.battery_soc>>
      icon_color: teal
      icon: mdi:home-battery
      tap_action:
        action: navigate
        navigation_path: energy
    - type: entity
      entity: <<energy.charge_power>>
      icon_color: green
      icon: mdi:battery-charging
      tap_action:
        action: navigate
        navigation_path: energy
    - type: entity
      entity: <<energy.discharge_power>>
      icon_color: red
      icon: mdi:battery-arrow-down
      tap_action:
        action: navigate
        navigation_path: energy
    - type: entity
      entity: <<energy.solar_power>>
      icon_color: green
      icon: mdi:solar-panel
      tap_action:
        action: navigate
        navigation_path: energy
    - type: entity
      entity: <<energy.grid_import>>
      icon_color: deep-orange
      icon: mdi:transmission-tower-import
      tap_action:
        action: navigate
        navigation_path: energy
    - type: entity
      entity: <<energy.peak_power>>
      icon_color: red
      icon: mdi:summit
    - type: entity
      entity: <<nav.kiosk_toggle>>
      content_info: none
      tap_action:
        action: toggle
      use_entity_picture: true
    - type: entity
      name: Laadpaal
      icon: phu:charging-station
      entity: <<energy.charger_daily>>
    - type: template
      icon: mdi:car-electric
      content: Nebula
      icon_color: '#006400'
      tap_action:
        action: navigate
        navigation_path: car
    - type: template
      icon: phu:garden
      content: Tuin
      icon_color: '#006400'
      tap_action:
        action: navigate
        navigation_path: garden
    - type: menu
    alignment: center

# --- Room sub-templates (PR-08) ---------------------------------------------
# Reusable decluttering templates for the repeated room patterns. Instantiated
# per view with a `custom:decluttering-card` + `variables:`. These bodies carry
# NO entity IDs — the real IDs are passed in as variables (rendered from the
# git-ignored entities.local.yaml) at the call site.

# One light control, normalized to a shared option set. `name`/`icon` are
# optional (null => the mushroom default: friendly name / auto icon), so a light
# with no explicit name or icon renders exactly as before. The only options
# dropped versus the raw cards are hide_state/show_color_control, both already
# equal to their mushroom defaults — so this is visually lossless.
room_light_row:
  default:
  - name: null
  - icon: null
  card:
    type: custom:mushroom-light-card
    entity: '[[entity]]'
    name: '[[name]]'
    icon: '[[icon]]'
    use_light_color: true
    show_brightness_control: true
    show_color_temp_control: true
    collapsible_controls: true
    tap_action:
      action: toggle

# Temperature + humidity readout with a 72h area chart. Faithful lift of the
# repeated stack-in-card block; only the two sensor entities vary per room.
sensor_graph_row:
  card:
    type: custom:stack-in-card
    cards:
    - type: grid
      square: false
      columns: 2
      cards:
      - type: custom:mushroom-entity-card
        entity: '[[temp_entity]]'
        primary_info: state
        secondary_info: name
        name: Temperatuur
        icon_color: green
      - type: custom:mushroom-entity-card
        entity: '[[humidity_entity]]'
        primary_info: state
        secondary_info: name
        name: Vochtigheidsgraad
        icon_color: blue
    - type: custom:apexcharts-card
      apex_config:
        chart:
          height: 150px
        legend:
          show: false
      graph_span: 72h
      yaxis:
      - id: first
        decimals: 0
        apex_config:
          tickAmount: 4
      - id: second
        opposite: true
        decimals: 0
        apex_config:
          tickAmount: 4
      header:
        show: false
        title: ApexCharts-Card
        colorize_states: true
      all_series_config:
        stroke_width: 3
        opacity: 0.3
        type: area
      series:
      - entity: '[[temp_entity]]'
        name: Temperatuur
        color: '#00bb33'
        yaxis_id: first
        group_by:
          func: max
          duration: 30min
      - entity: '[[humidity_entity]]'
        name: Vochtigheidsgraad
        color: '#2196f3'
        yaxis_id: second
        group_by:
          func: max
          duration: 30min

# Temp + humidity readout with a 72h **mini-graph** (distinct from sensor_graph_row, which uses
# apexcharts and is used by inkomhal). This block is shared VERBATIM by slaapkamer/kinderkamer/
# logeerkamer (proven byte-identical, entity-agnostic); only the two sensor entities vary.
sensor_graph_mini:
  card:
    type: custom:stack-in-card
    cards:
    - type: grid
      square: false
      columns: 2
      cards:
      - type: custom:mushroom-entity-card
        entity: '[[temp_entity]]'
        primary_info: state
        secondary_info: name
        name: Temperatuur
        icon_color: green
      - type: custom:mushroom-entity-card
        entity: '[[humidity_entity]]'
        primary_info: state
        secondary_info: name
        name: Vochtigheidsgraad
        icon_color: blue
    - type: custom:mini-graph-card
      entities:
      - entity: '[[temp_entity]]'
        name: Temperatuur
        color: '#00bb33'
      - entity: '[[humidity_entity]]'
        name: Vochtigheidsgraad
        color: '#2196f3'
        y_axis: secondary
      hours_to_show: 72
      line_width: 3
      font_size: 50
      animate: true
      show:
        name: false
        icon: false
        state: false
        legend: false
        fill: fade

# CO2 / air-quality readout with a 72h mini-graph. Shared VERBATIM by the same three rooms;
# only the CO2 entity varies.
air_quality_mini:
  card:
    type: custom:stack-in-card
    cards:
    - type: grid
      square: false
      columns: 1
      cards:
      - type: custom:mushroom-entity-card
        entity: '[[co2_entity]]'
        primary_info: state
        secondary_info: name
        name: luchtkwaliteit
        icon_color: red
    - type: custom:mini-graph-card
      entities:
      - entity: '[[co2_entity]]'
        name: luchtkwaliteit
        color: red
      hours_to_show: 72
      line_width: 3
      font_size: 50
      animate: true
      show:
        name: false
        icon: false
        state: false
        legend: false
        fill: fade
