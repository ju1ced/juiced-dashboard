    hold_action:
      action: none
    double_tap_action:
      action: none
    icon_color: orange
    grid_options:
      columns: 12
      rows: 1
  - type: vertical-stack
    cards:
    - show_current: true
      show_forecast: true
      type: weather-forecast
      entity: <<house.vichte>>
      forecast_type: daily
    - display_order: none
      type: shopping-list
      title: Winkellijst
