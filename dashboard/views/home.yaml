  - type: vertical-stack
    cards:
    - type: custom:expander-card
      title-card-clickable: true
      expanded: true
      min-width-expanded: 1024
      title-card-button-overlay: true
      expanded-gap: 1em
      padding: 0px
      child-margin-top: 0.5em
      expander-card-background: transparent
      expander-card-background-expanded: transparent
      title: Buiten
      title-card:
        name: Electriciteit, Zon & Batterij
        styles:
          card:
          - padding: 2% 0px
          - font-size: 125%
          - border-radius: 0%
          - font-weight: 100
          - letter-spacing: 3px
          - --mdc-ripple-press-opacity: 0
          - cursor: initial
          name:
          - font-weight: 900
        type: custom:button-card
      cards:
      - type: horizontal-stack
        cards:
        - type: gauge
          entity: <<home.elektriciteit_verbruik_combined>>
          max: 11000
          severity:
            green: 0
            yellow: 3000
            red: 7500
          needle: true
        - type: gauge
          name: Capaciteitspiek
          max: 11
          severity:
            green: 0
            yellow: 4.5
            red: 7.5
          needle: true
          entity: <<home.p1_meter_piekverbruik_huidige_maand>>
        - type: gauge
          entity: <<home.p1_meter_vermogen>>
          min: -8000
          max: 11000
          needle: true
          name: Verbruik/Teruglevering
          severity:
            green: -1500
            yellow: 2500
            red: 7500
          card_mod:
            style: "ha-card {\n  {% set v = states('<<home.p1_meter_vermogen>>') |\
              \ float(0) %}\n  \n  /* Gebruik thema variabelen voor perfecte match\
              \ */\n  {% set rood = '#e74c3c' %}\n  {% set oranje = '#ffa600' %}\n\
              \  {% set groen = '#43a047' %}\n\n  /* 1. Kleur van de naald en de gevulde\
              \ balk - gesynct met severity */\n  {% if v < -1000 or v > 7500 %}\n\
              \    --gauge-color: {{ rood }} !important;\n  {% elif v < -1500 or v\
              \ > 2500 %}\n    --gauge-color: {{ oranje }} !important;\n  {% else\
              \ %}\n    --gauge-color: {{ groen }} !important;\n  {% endif %}\n\n\
              \  /* 2. De 'standaard' kleur (onder de 0) */\n  --primary-color: {%\
              \ if v < -1000 %} {{ rood }} {% else %} {{ oranje }} {% endif %} !important;\n\
              \  \n  /* 3. Forceer de kleur van de actieve arc */\n  --info-color:\
              \ {% if v < -1000 %} {{ rood }} {% else %} {{ oranje }} {% endif %}\
              \ !important;\n  \n  /* Zorg dat de statische segmenten op de rand ook\
              \ de juiste kleur hebben */\n  --success-color: {{ groen }} !important;\n\
              \  --warning-color: {{ oranje }} !important;\n  --error-color: {{ rood\
              \ }} !important;\n}\n:host {\n  --paper-item-icon-color: #ffa600 !important;\n\
              }\n"
      - type: horizontal-stack
        cards:
        - type: gauge
          entity: <<home.zonnepanelen_opbrengst_vermogen>>
          max: 8000
          severity:
            green: 5000
            yellow: 1000
            red: 0
          needle: true
          name: ZP Totaal
        - type: gauge
          name: Batterij SoC
          needle: true
          max: 99
          severity:
            green: 65
            yellow: 25
            red: 0
          entity: <<home.battery_soc_total>>
        - type: conditional
          conditions:
          - condition: numeric_state
            entity: <<home.battery_power_charge_total>>
            above: 0
          card:
            type: gauge
            entity: <<home.battery_power_charge_total>>
            name: Batterij Laden
            max: 5000
            severity:
              green: 3000
              yellow: 1000
              red: 0
            needle: true
            unit: W
        - type: conditional
          conditions:
          - condition: numeric_state
            entity: <<home.battery_power_discharge_total>>
            above: 0
          card:
            type: gauge
            name: Batterij ontladen
            needle: true
            max: 5000
            severity:
              green: 0
              yellow: 2000
              red: 4000
            entity: <<home.battery_power_discharge_total>>
      - type: horizontal-stack
        cards:
        - type: conditional
          conditions:
          - condition: numeric_state
            entity: <<home.person_1_load_person_1_1>>
            above: 5
          card:
            type: gauge
            name: Auto laden
            needle: true
            severity:
              green: 0
              yellow: 3500
              red: 5000
            entity: <<home.person_1_load_person_1_1>>
            max: 7400
        - type: conditional
          conditions:
          - condition: numeric_state
            entity: <<home.dekra_person_1_load_person_1_1>>
            above: 5
          card:
            type: gauge
            name: Auto SoC
            needle: true
            entity: <<home.oprit_nebula_ev_battery_level>>
            max: 100
            severity:
              green: 70
              yellow: 40
              red: 0
      - type: horizontal-stack
        cards:
        - type: gauge
          entity: <<home.p1_meter_spanning_fase_1>>
          min: 230
          max: 245
          severity:
            green: 230
            yellow: 237
            red: 240
          needle: true
          name: L1
        - type: gauge
          entity: <<home.p1_meter_spanning_fase_2>>
          min: 230
          max: 245
          severity:
            green: 230
            yellow: 237
            red: 240
          needle: true
          name: L2
        - type: gauge
          min: 230
          max: 245
          severity:
            green: 230
            yellow: 237
            red: 240
          needle: true
          entity: <<home.p1_meter_spanning_fase_3>>
          name: L3
      - type: energy-distribution
        link_dashboard: true
      - type: power-sources-graph
  column_span: 4
