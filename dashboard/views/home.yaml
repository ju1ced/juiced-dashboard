# Home hub — migrated to committed YAML (PR-33, heaviest view: 137 cards).
# Faithful 1:1 lift via scripts/extract_view.py (round-trip deep-equals the
# default view). T7 untangle applied: explicit `type: sections`, stable
# `path: home` (fixes fragile lovelace/0 + the nav 'Home' deep-link), and the
# empty top-level cards[] dropped. card_mod kept verbatim (theme-token pass is
# PR-38). Real IDs resolve from the git-ignored entities.local.yaml.
type: sections
title: Home
path: home
badges:
- type: custom:decluttering-card
  template: global_navigation_badges
header:
  layout: responsive
  badges_position: bottom
  badges_wrap: wrap
sections:
- type: grid
  cards:
  - type: vertical-stack
    cards:
    - type: horizontal-stack
      cards:
      - type: weather-forecast
        entity: <<home.tomorrow_io_household_home_daily>>
        forecast_type: daily
    - type: conditional
      conditions:
      - condition: screen
        media_query: '(min-width: 768px)'
      card:
        type: vertical-stack
        cards:
        - type: horizontal-stack
          cards:
          - type: custom:mushroom-template-card
            primary: Huis
            secondary: ''
            icon: mdi:home
            tap_action:
              action: navigate
              navigation_path: house
            color: blue
            vertical: true
            features_position: bottom
          - type: custom:mushroom-template-card
            icon: mdi:wind-power
            icon_color: teal
            tap_action:
              action: navigate
              navigation_path: ecopower
            fill_container: true
            secondary: ''
            primary: Ecopower
            layout: vertical
          - type: custom:mushroom-template-card
            primary: HA info
            secondary: ''
            icon: mdi:home-assistant
            icon_color: red
            layout: vertical
            tap_action:
              action: navigate
              navigation_path: hainfo
          - type: custom:mushroom-template-card
            primary: Tuin
            secondary: ''
            icon: phu:garden
            icon_color: green
            layout: vertical
            tap_action:
              action: navigate
              navigation_path: garden
          - type: horizontal-stack
            cards:
            - type: custom:mushroom-template-card
              secondary: ''
              icon: mdi:battery
              tap_action:
                action: navigate
                navigation_path: batteries1
              primary: Batteries 1
              color: orange
              vertical: true
              features_position: bottom
        - type: horizontal-stack
          cards:
          - type: custom:mushroom-template-card
            primary: Water
            secondary: ''
            icon: mdi:water
            tap_action:
              action: navigate
              navigation_path: water
            color: blue
            vertical: true
            features_position: bottom
          - type: custom:mushroom-template-card
            primary: Valliant
            secondary: ''
            icon: mdi:hvac
            icon_color: teal
            layout: vertical
            tap_action:
              action: navigate
              navigation_path: valliant
          - type: custom:mushroom-template-card
            primary: Unifi
            secondary: ''
            icon: mdi:network
            icon_color: red
            layout: vertical
            tap_action:
              action: navigate
              navigation_path: net
          - type: custom:mushroom-template-card
            primary: Kia EV6
            secondary: ''
            icon: mdi:car-electric-outline
            tap_action:
              action: navigate
              navigation_path: car
            color: green
            vertical: true
            features_position: bottom
          - type: custom:mushroom-template-card
            primary: Kobra S1
            secondary: ''
            icon: mdi:printer-3d
            tap_action:
              action: navigate
              navigation_path: anycubic
            color: orange
            vertical: true
            features_position: bottom
    - type: horizontal-stack
      cards:
      - type: custom:button-card
        name: ' '
        entity: <<home.person_1>>
        show_icon: false
        tap_action:
          action: navigate
          navigation_path: person
        custom_fields:
          n:
            card:
              type: custom:mushroom-person-card
              entity: <<home.person_1>>
              use_entity_picture: true
              hide_name: true
              layout: vertical
              tap_action:
                action: navigate
                navigation_path: person
          s1:
            card:
              type: custom:mushroom-chips-card
              alignment: middle
              chips:
              - type: template
                icon_color: '{% set state=states(''<<home.in2023_is_charging>>'')
                  %}

                  {% if state==''on'' %} green

                  {% else %} #6f6f6f

                  {% endif %}'
                entity: <<home.oneplus_person_1_is_charging>>
                icon: mdi:power-plug
                tap_action:
                  action: more-info
              - type: template
                entity: <<home.oneplus_person_1_battery_level>>
                icon: '{% set bl = states(''<<home.oneplus_person_1_battery_level>>'')
                  | int(0) %}

                  {% if bl < 10 %} mdi:battery-outline

                  {% elif bl < 20 %} mdi:battery-10

                  {% elif bl < 30 %} mdi:battery-20

                  {% elif bl < 40 %} mdi:battery-30

                  {% elif bl < 50 %} mdi:battery-40

                  {% elif bl < 60 %} mdi:battery-50

                  {% elif bl < 70 %} mdi:battery-60

                  {% elif bl < 80 %} mdi:battery-70

                  {% elif bl < 90 %} mdi:battery-80

                  {% elif bl < 100 %} mdi:battery-90

                  {% elif bl == 100 %} mdi:battery

                  {% else %} mdi:battery-unknown

                  {% endif %}

                  '
                icon_color: '{% set bl = states(''<<home.oneplus_person_1_battery_level>>'')
                  | int(0) %}

                  {% if bl < 30 %} red

                  {% elif bl < 50 %} orange

                  {% elif bl <= 100 %} green

                  {% else %} grey

                  {% endif %}'
                tap_action:
                  action: more-info
              - type: template
                icon_color: '{% set state=states(''<<home.oneplus_watch_2_person_1_battery_state>>'')
                  %}

                  {% if state==''charging'' %} green

                  {% else %} #6f6f6f

                  {% endif %}'
                entity: <<home.oneplus_watch_2_person_1_battery_state>>
                icon: mdi:watch
                tap_action:
                  action: more-info
              - type: template
                entity: <<home.oneplus_watch_2_person_1_battery_level>>
                icon: '{% set bl = states(''<<home.oneplus_watch_2_person_1_battery_level>>'')
                  | int(0) %}

                  {% if bl < 10 %} mdi:battery-outline

                  {% elif bl < 20 %} mdi:battery-10

                  {% elif bl < 30 %} mdi:battery-20

                  {% elif bl < 40 %} mdi:battery-30

                  {% elif bl < 50 %} mdi:battery-40

                  {% elif bl < 60 %} mdi:battery-50

                  {% elif bl < 70 %} mdi:battery-60

                  {% elif bl < 80 %} mdi:battery-70

                  {% elif bl < 90 %} mdi:battery-80

                  {% elif bl < 100 %} mdi:battery-90

                  {% elif bl == 100 %} mdi:battery

                  {% else %} mdi:battery-unknown

                  {% endif %}

                  '
                icon_color: '{% set bl = states(''<<home.oneplus_watch_2_person_1_battery_level>>'')
                  | int(0) %}

                  {% if bl < 30 %} red

                  {% elif bl < 50 %} orange

                  {% elif bl <= 100 %} green

                  {% else %} grey

                  {% endif %}'
                tap_action:
                  action: more-info
        styles:
          grid:
          - grid-template-areas: '"n" "s1"'
          - grid-template-columns: 1fr
          - grid-template-rows: fr fr fr fr
          card:
          - padding: 8px
          - display: flex
          - justify-content: center
          - align-items: center
          custom_fields:
            s1:
            - font-size: 10px
            - opacity: '0.7'
            - justify-content: center
            - align-self: center
            - padding: 0px 0px 5px 0px
          name:
          - text-align: center
          - justify-content: center
          - align-self: center
          - font-size: 120%
          - font-weight: 900
          - letter-spacing: 3px
          - --mdc-ripple-press-opacity: 0
          - cursor: initial
          - padding: 0px 0px 5px 0px
      - type: custom:button-card
        name: ' '
        entity: <<home.person_2>>
        show_icon: false
        tap_action:
          action: navigate
          navigation_path: person
        custom_fields:
          n:
            card:
              type: custom:mushroom-person-card
              alignment: middle
              entity: <<home.person_2>>
              use_entity_picture: true
              hide_name: true
              layout: vertical
              tap_action:
                action: navigate
                navigation_path: person
          s1:
            card:
              type: custom:mushroom-chips-card
              alignment: middle
              chips:
              - type: template
                icon_color: "          {% set state=states('<<home.iphone_van_person_2_battery_state>>')\
                  \ %}\n          {% if state=='on' %}\n          green\n        \
                  \  {% elif state=='off' %}\n          #6f6f6f\n         {% endif\
                  \ %}"
                entity: <<home.iphone_van_person_2_battery_state>>
                icon: mdi:power-plug
                tap_action:
                  action: more-info
              - type: template
                entity: <<home.iphone_van_person_2_battery_level>>
                icon: "          {% set bl = states('<<home.iphone_van_person_2_battery_level>>')\
                  \ | int(0) %}\n          {% if bl < 10 %} mdi:battery-outline\n\
                  \          {% elif bl < 20 %} mdi:battery-10\n          {% elif\
                  \ bl < 30 %} mdi:battery-20\n          {% elif bl < 40 %} mdi:battery-30\n\
                  \          {% elif bl < 50 %} mdi:battery-40\n          {% elif\
                  \ bl < 60 %} mdi:battery-50\n          {% elif bl < 70 %} mdi:battery-60\n\
                  \          {% elif bl < 80 %} mdi:battery-70\n          {% elif\
                  \ bl < 90 %} mdi:battery-80\n          {% elif bl < 100 %} mdi:battery-90\n\
                  \          {% elif bl == 100 %} mdi:battery\n          {% else %}\
                  \ mdi:battery-unknown\n          {% endif %}\n"
                icon_color: "          {% set bl = states('<<home.iphone_van_person_2_battery_level>>')\
                  \ | int(0) %}\n          {% if bl < 10 %} red\n          {% elif\
                  \ bl < 20 %} red\n          {% elif bl < 30 %} red\n          {%\
                  \ elif bl < 40 %} orange\n          {% elif bl < 50 %} orange\n\
                  \          {% elif bl < 60 %} green\n          {% elif bl < 70 %}\
                  \ green\n          {% elif bl < 80 %} green\n          {% elif bl\
                  \ < 90 %} green\n          {% elif bl < 100 %} green\n         \
                  \ {% elif bl == 100 %} green\n          {% else %} grey\n      \
                  \    {% endif %}"
                tap_action:
                  action: more-info
        styles:
          grid:
          - grid-template-areas: '"n" "s1" "btn" "btn1"'
          - grid-template-columns: fr
          - grid-template-rows: fr fr fr fr
          card:
          - padding: 8px 8px 8px 8px
          - display: flex
          - justify-content: center
          - align-items: center
          custom_fields:
            btn:
            - justify-content: center
            - align-self: center
            - padding: 0px 0px 5px 0px
            btn1:
            - justify-content: center
            - align-self: center
            - padding: 0px 0px 5px 0px
            s1:
            - font-size: 10px
            - opacity: '0.7'
            - justify-content: center
            - align-self: center
            - padding: 0px 0px 5px 0px
          name:
          - text-align: center
          - justify-content: center
          - align-self: center
          - font-size: 120%
          - border-radius: 0%
          - font-weight: 900
          - letter-spacing: 3px
          - --mdc-ripple-press-opacity: 0
          - cursor: initial
          - padding: 0px 0px 5px 0px
    - square: false
      type: grid
      cards:
      - type: conditional
        conditions:
        - condition: numeric_state
          entity: <<home.restafval_timestamp>>
          below: <<home.pmd_timestamp>>
        - condition: numeric_state
          entity: <<home.restafval_timestamp>>
          below: <<home.karton_timestamp>>
        card:
          type: custom:mushroom-template-card
          entity: <<home.restafval>>
          primary: Restafval
          secondary: '{{ states(''<<home.restafval>>'') }} • {{ state_attr(''<<home.restafval>>'',''days'')
            }} dagen

            '
          picture: '{{ state_attr(''<<home.restafval>>'',''entity_picture'') }}'
          icon: mdi:trash-can
          layout: horizontal
          fill_container: true
          multiline_secondary: false
          tap_action:
            action: none
          card_mod:
            style: "ha-card {\n  border-radius: 999px;\n  padding: 8px 16px;\n}\n"
      - type: conditional
        conditions:
        - condition: numeric_state
          entity: <<home.restafval_timestamp>>
          below: <<home.pmd_timestamp>>
        - condition: numeric_state
          entity: <<home.restafval_timestamp>>
          below: <<home.karton_timestamp>>
        card:
          type: custom:mushroom-template-card
          entity: <<home.gf_t_keukenafval>>
          primary: GFT
          secondary: '{{ states(''<<home.gf_t_keukenafval>>'') }} • {{ state_attr(''<<home.gf_t_keukenafval>>'',''days'')
            }} dagen

            '
          picture: '{{ state_attr(''<<home.gf_t_keukenafval>>'',''entity_picture'')
            }}'
          icon: mdi:leaf
          layout: horizontal
          fill_container: true
          multiline_secondary: false
          tap_action:
            action: none
          card_mod:
            style: "ha-card {\n  border-radius: 999px;\n  padding: 8px 16px;\n}\n"
      - type: conditional
        conditions:
        - condition: numeric_state
          entity: <<home.pmd_timestamp>>
          below: <<home.restafval_timestamp>>
        - condition: numeric_state
          entity: <<home.pmd_timestamp>>
          below: <<home.karton_timestamp>>
        card:
          type: custom:mushroom-template-card
          entity: <<home.pmd>>
          primary: PMD
          secondary: '{{ states(''<<home.pmd>>'') }} • {{ state_attr(''<<home.pmd>>'',''days'')
            }} dagen

            '
          picture: '{{ state_attr(''<<home.pmd>>'',''entity_picture'') }}'
          icon: mdi:recycle
          layout: horizontal
          fill_container: true
          multiline_secondary: false
          tap_action:
            action: none
          card_mod:
            style: "ha-card {\n  border-radius: 999px;\n  padding: 8px 16px;\n}\n"
      - type: conditional
        conditions:
        - condition: numeric_state
          entity: <<home.karton_timestamp>>
          below: <<home.restafval_timestamp>>
        - condition: numeric_state
          entity: <<home.karton_timestamp>>
          below: <<home.pmd_timestamp>>
        card:
          type: custom:mushroom-template-card
          entity: <<home.papier_karton>>
          primary: Karton
          secondary: '{{ states(''<<home.papier_karton>>'') }} • {{ state_attr(''<<home.papier_karton>>'',''days'')
            }} dagen

            '
          picture: '{{ state_attr(''<<home.papier_karton>>'',''entity_picture'') }}'
          icon: mdi:package-variant
          layout: horizontal
          fill_container: true
          multiline_secondary: false
          tap_action:
            action: none
          card_mod:
            style: "ha-card {\n  border-radius: 999px;\n  padding: 8px 16px;\n}\n"
      columns: 2
    - type: custom:expander-card
      title-card-clickable: true
      expanded: true
      min-width-expanded: 1024
      title-card-button-overlay: true
      expanded-gap: 1em
      padding: 0px
      child-margin-top: 0.5em
      expander-card-background: transparent
      expander-card-background-expanded: transparent
      title: Buiten
      title-card:
        name: Buiten
        styles:
          card:
          - padding: 2% 0px
          - font-size: 125%
          - border-radius: 0%
          - font-weight: 100
          - letter-spacing: 3px
          - --mdc-ripple-press-opacity: 0
          - cursor: initial
          name:
          - font-weight: 900
        type: custom:button-card
      cards:
      - type: vertical-stack
        cards:
        - type: custom:button-card
          name: Oprit
          entity: <<home.daikin_badkamer_climatecontrol_buiten_temperatuur>>
          show_icon: false
          tap_action:
            action: navigate
            navigation_path: oprit
          custom_fields:
            s1:
              card:
                type: custom:mushroom-chips-card
                alignment: center
                chips:
                - type: entity
                  entity: <<home.daikin_badkamer_climatecontrol_buiten_temperatuur>>
                  card_mod:
                    style: "ha-card {\n--chip-background: transparent;\npadding: 0px;\n\
                      border: 0px;                   \n}\n"
                - type: template
                  entity: <<home.oprit_nebula_ev_battery_charge>>
                  icon: phu:kia
                  icon_color: "{% if is_state('<<home.oprit_nebula_ev_battery_charge>>',\
                    \ 'on') %}\n  green\n{% else %}\n  disabled\n{% endif %}\n"
                  card_mod:
                    style: "ha-card {\n  --chip-background: transparent;\n  padding:\
                      \ 0px;\n  border: 0px;\n}\n"
                - type: template
                  entity: <<home.oprit_nebula_ev_charging_power>>
                  content: '{% set power = states(''<<home.oprit_nebula_ev_charging_power>>'')
                    | float(0) %} {{ power | round(1) }} kW

                    '
                  icon: "{% if states('<<home.oprit_nebula_ev_charging_power>>') |\
                    \ float(0) < 22 %}\n  mdi:ev-plug-type2\n{% else %}\n  mdi:ev-plug-ccs2\n\
                    {% endif %}\n"
                  card_mod:
                    style: "ha-card {\n--chip-background: transparent;\npadding: 0px;\n\
                      border: 0px;                   \n}\n"
            btn:
              card:
                type: custom:mushroom-chips-card
                alignment: center
                chips:
                - type: template
                  entity: <<home.garagepoort_open_state>>
                  icon: "{% if is_state('<<home.garagepoort_open_state>>', 'on') %}\n\
                    \  mdi:garage-open\n{% else %}\n  mdi:garage\n{% endif %}\n"
                  tap_action:
                    action: call-service
                    service: switch.toggle
                    service_data:
                      entity_id: <<home.garagepoort>>
                  card_mod:
                    style: "ha-card {\n  /* Set hover and active effects */\n  --chip-box-shadow:\
                      \ 0px 0px 5px 0px rgba(0, 0, 0, 0.2);\n  --chip-background:\
                      \ {{ 'rgba(67, 138, 94, 0.7)' if is_state('<<home.garagepoort_open_state>>',\
                      \ 'off') else 'rgba(230, 118, 118, 0.7)' }};;\n}\nha-card:hover\
                      \ {\n  background-color: {{ 'rgba(67, 138, 94, 0.7)' if is_state('<<home.garagepoort_open_state>>',\
                      \ 'on') else 'rgba(230, 118, 118, 0.7)' }};;\n}\n"
                - type: template
                  entity: <<home.post_in_brievenbus>>
                  icon: "{% if is_state('<<home.post_in_brievenbus>>', 'on') %}\n\
                    \  mdi:mailbox-up\n{% else %}\n  mdi:mailbox\n{% endif %}\n"
                  tap_action:
                    action: toggle
                  card_mod:
                    style: "ha-card {\n  --chip-box-shadow: 0px 0px 5px 0px rgba(0,\
                      \ 0, 0, 0.2);\n  --chip-background: {{ 'rgba(244, 67, 54, 1)'\
                      \ if is_state('<<home.post_in_brievenbus>>', 'on') else 'var(--main-icon-background-color)'\
                      \ }};\n}\nha-card:hover {\n  background-color: {{ 'rgba(67,\
                      \ 138, 94, 0.7)' if is_state('<<home.post_in_brievenbus>>',\
                      \ 'on') else 'var(--main-icon-background-color)' }};\n}\n"
                - type: template
                  entity: <<home.12_koornbloemstraat_8570_anzegem>>
                  icon: "{% if is_state('<<home.12_koornbloemstraat_8570_anzegem>>',\
                    \ 'on') %}\n  mdi:trash-can\n{% else %}\n  mdi:trash-can-outline\n\
                    {% endif %}\n"
                  tap_action:
                    action: call-service
                    service: input_boolean.turn_on
                    service_data:
                      entity_id: <<home.afvalophaling_buitengezet>>
                  card_mod:
                    style: "ha-card {\n  --chip-background: \n    {% if is_state('<<home.afvalophaling_bevestigd>>',\
                      \ 'on') %}\n      var(--main-icon-background-color)\n    {%\
                      \ else %}\n      {% set rest = state_attr('<<home.restafval>>','days')\
                      \ | int(99) %}\n      {% set gft = state_attr('<<home.gf_t_keukenafval>>','days')\
                      \ | int(99) %}\n      {% set pmd = state_attr('<<home.pmd>>','days')\
                      \ | int(99) %}\n      {% set karton = state_attr('<<home.papier_karton>>','days')\
                      \ | int(99) %}\n      {% set groen = [rest, gft] | min <= 1\
                      \ %}\n      {% set blauw = [pmd, karton] | min <= 1 %}\n   \
                      \   {% if groen and blauw %}\n        rgba(128, 0, 128, 0.85)\n\
                      \      {% elif groen %}\n        rgba(0, 170, 0, 0.85)\n   \
                      \   {% elif blauw %}\n        rgba(0, 100, 255, 0.85)\n    \
                      \  {% else %}\n        var(--main-icon-background-color)\n \
                      \     {% endif %}\n    {% endif %};\n}\n"
                - type: template
                  tap_action:
                    action: toggle
                  entity: <<home.schakelaar_voordeur_l1>>
                  icon: phu:wall-fuzo
                  card_mod:
                    style: "ha-card {\n  --chip-background: {{ 'rgba(255, 181, 118,\
                      \ 0.8)' if is_state('<<home.schakelaar_voordeur_l1>>', 'on')\
                      \ else 'var(--main-icon-background-color)' }};\n  padding: 1px!important;\n\
                      \  border-radius: 100px!important;\n}\n"
                - type: template
                  tap_action:
                    action: toggle
                  entity: <<home.nightshade_start_climate>>
                  icon: mdi:fan-plus
                  card_mod:
                    style: "ha-card {\n  --chip-background: {{ 'rgba(255, 181, 118,\
                      \ 1)' if is_state('<<home.nightshade_start_climate>>', 'on')\
                      \ else 'var(--main-icon-background-color)' }};\n  padding: 1px!important;\n\
                      \  border-radius: 100px!important;\n}\n \nha-card:hover {\n\
                      \  background-color: rgba(67, 138, 94, 0.7) !important;\n}\n"
                - type: template
                  tap_action:
                    action: more-info
                  entity: <<home.deurbel_high_resolution_channel>>
                  icon: mdi:doorbell-video
                  card_mod:
                    style: "ha-card {\n  --chip-background: var(--main-icon-background-color);\n\
                      \  padding: 1px!important;\n  border-radius: 100px!important;\n\
                      }   \nha-card:hover {\n  background-color: rgba(67, 138, 94,\
                      \ 0.7) !important;\n}\n"
                - type: entity
                  entity: <<home.deursensor_voordeur>>
                  content_info: none
                  card_mod:
                    style: "ha-card {\n  --chip-background: {{ 'rgba(67, 138, 94,\
                      \ 0.7)' if is_state('<<home.deursensor_voordeur>>', 'off') else\
                      \ 'rgba(230, 118, 118, 0.7)' }};;\n  --icon-color: black;\n\n\
                      \  border-radius: 100px!important;\n}\n"
                - type: template
                  entity: <<home.deurbel_beweging>>
                  tap_action:
                    action: more-info
                  icon: "{% if is_state('<<home.deurbel_beweging>>', 'on') %}\n  mdi:motion-sensor\n\
                    {% else %}\n  mdi:motion-sensor-off\n{% endif %}\n"
                  card_mod:
                    style: "ha-card {\n  --chip-background: {{ 'rgba(67, 138, 94,\
                      \ 0.7)' if is_state('<<home.deurbel_beweging>>', 'off') else\
                      \ 'rgba(230, 118, 118, 0.7)' }};;\n  --icon-color: black;\n\n\
                      \  border-radius: 100px!important;\n}\n"
          styles:
            grid:
            - grid-template-areas: '"n" "s1" "btn" "btn1"'
            - grid-template-columns: fr
            - grid-template-rows: fr fr fr fr
            card:
            - padding: 8px 8px 8px 8px
            - display: flex
            - justify-content: center
            - align-items: center
            custom_fields:
              btn:
              - justify-content: center
              - align-self: center
              - padding: 0px 0px 5px 0px
              btn1:
              - justify-content: center
              - align-self: center
