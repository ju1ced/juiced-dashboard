# Parameterized from a dashboard export for view 'badkamer'. Review keys before committing.
theme: Backend-selected
title: badkamer
path: badkamer
type: sections
badges:
- type: custom:decluttering-card
  template: global_navigation_badges
cards: []
sections:
- type: grid
  cards:
  - type: vertical-stack
    cards:
    - type: custom:mushroom-light-card
      entity: <<badkamer.badkamer>>
      use_light_color: true
    - control:
      - hvac
      - preset
      - fan
      - swing
      entity: <<badkamer.daikin_badkamer_room_temperature>>
      header: {}
      label:
        temperature: temperatuur
      hide:
        state: true
        temperature: false
      layout:
        mode:
          headings: false
          icons: true
          names: true
        sensors:
          labels: true
        step: row
      type: custom:simple-thermostat
    - card:
        cards:
        - cards:
          - entities:
            - buttons:
              - entity: <<badkamer.ht_badkamer_temperatuur>>
                layout: icon|state|name
                name: °C
                styles:
                  button:
                    border-radius: 10px
                    color: green
              type: custom:paper-buttons-row
            type: entities
          - entities:
            - buttons:
              - entity: <<badkamer.ht_badkamer_luchtvochtigheid>>
                layout: icon|state|name
                name: '%'
                styles:
                  button:
                    border-radius: 10px
                    color: green
              type: custom:paper-buttons-row
            type: entities
          - entities:
            - buttons:
              - entity: <<badkamer.raamsensor_badkamer_licht>>
                layout: icon|state|name
                icon: mdi:brightness-5
                name: lux
                styles:
                  button:
                    border-radius: 10px
                    color: green
              type: custom:paper-buttons-row
            type: entities
          - entities:
            - buttons:
              - entity: <<badkamer.raamsensor_badkamer_raam>>
                layout: icon|state
                state_icons:
                  'off': mdi:window-closed
                  'on': mdi:window-open
                state_styles:
                  'off':
                    button:
                      color: green
                  'on':
                    button:
                      color: red
                state_text:
                  'off': raam gesloten
                  'on': raam open
                name: ''
                styles:
                  button:
                    border-radius: 10px
                    color: green
              type: custom:paper-buttons-row
            type: entities
          - entities:
            - buttons:
              - entity: <<badkamer.bewegingssensor_badkamer_occupancy>>
                layout: icon|state
                state_icons:
                  'off': mdi:motion-sensor-off
                  'on': mdi:motion-sensor
                state_styles:
                  'off':
                    button:
                      border-radius: 10px
                      color: green
                  'on':
                    button:
                      border-radius: 10px
                      color: red
                state_text:
                  'off': Geen beweging
                  'on': beweging gedetecteerd
              type: custom:paper-buttons-row
            type: entities
          - entities:
            - buttons:
              - entity: <<badkamer.raamsensor_badkamer_rotation>>
                layout: icon|state|name
                name: °
                icon: mdi:rotate-3d
                styles:
                  button:
                    border-radius: 10px
                    color: green
              type: custom:paper-buttons-row
            type: entities
          - entities:
            - attribute: battery_percent
              critical: 25
              entity: <<badkamer.bewegingssensor_badkamer_battery>>
              name: motion
              type: custom:battery-entity-row
              unit: '%'
              warning: 50
            type: entities
          - entities:
            - attribute: battery_percent
              critical: 25
              entity: <<badkamer.raamsensor_badkamer_batterij>>
              name: raam
              type: custom:battery-entity-row
              unit: '%'
              warning: 50
            type: entities
          columns: 2
          input_entity: <<badkamer.voordeur_sensor_battery_low>>
          input_name: ''
          square: false
          type: grid
        type: vertical-stack
      type: custom:mod-card
      style: "ha-card {\n  background: var( --ha-card-background, var(--card-background-color, white)\
        \ );\n  border-radius: var(--ha-card-border-radius, 4px);\n  box-shadow: var( --ha-card-box-shadow,\
        \ 0px 2px 1px -1px rgba(0, 0, 0, 0.2), 0px 1px 1px 0px rgba(0, 0, 0, 0.14), 0px 1px 3px 0px rgba(0,\
        \ 0, 0, 0.12) );\n}\nh1 {\n  color: red !important;\n}\n"
  - type: vertical-stack
    cards:
    - type: custom:mini-media-player
      speaker_group:
        platform: sonos
        show_group_count: true
        entities:
        - entity_id: <<badkamer.keuken>>
          name: Sonos keuken
        - entity_id: <<badkamer.living>>
          name: Sonos Living
        - entity_id: <<badkamer.kantoor>>
          name: Sonos kantoor
        - entity_id: <<badkamer.badkamer_2>>
          name: Sonos badkamer
        - entity_id: <<badkamer.slaapkamer>>
          name: Sonos Slaapkamer
        - entity_id: <<badkamer.bbq_buitenkeuken>>
          name: Sonos BBQ buitenkeuken
        - entity_id: <<badkamer.tuinhuis>>
          name: Sonos Tuinhuis
      artwork: cover
      source: icon
      sound_mode: icon
      info: scroll
      entity: <<badkamer.badkamer_2>>
    - type: custom:stack-in-card
      cards:
      - type: grid
        square: false
        columns: 2
        cards:
        - type: custom:mushroom-entity-card
          entity: <<badkamer.ht_badkamer_temperatuur>>
          primary_info: state
          secondary_info: name
          name: Temperatuur
          icon_color: green
        - type: custom:mushroom-entity-card
          entity: <<badkamer.ht_badkamer_luchtvochtigheid>>
          primary_info: state
          secondary_info: name
          name: Luchtvochtigheid
          icon_color: blue
      - type: custom:mini-graph-card
        entities:
        - entity: <<badkamer.ht_badkamer_temperatuur>>
          name: Temperatuur
          color: '#00bb33'
        - entity: <<badkamer.ht_badkamer_luchtvochtigheid>>
          name: Temperatuur
          color: '#2196f3'
        hours_to_show: 72
        line_width: 3
        font_size: 50
        animate: true
        show:
          name: false
          icon: false
          state: false
          legend: false
          fill: fade
    - type: vertical-stack
      cards:
      - card_mod:
          style: "ha-card {\n  --restriction-lock-row-margin-left: 82%;\n  --restriction-regular-lock-color:\
            \ #13269e\n}\n"
        entities:
        - entity: <<badkamer.daikin_badkamer_climatecontrol_dagelijks_elektriciteitsverbruik_koelen>>
          name: Dagelijks Verbruik Koelen
        - entity: <<badkamer.daikin_badkamer_climatecontrol_dagelijks_elektriciteitsverbruik_verwarmen>>
          name: Dagelijks Verbruik Verwarmen
        - entity: <<badkamer.daikin_badkamer_climatecontrol_maandelijks_elektriciteitsverbruik_koelen>>
          name: Maandelijks Verbruik Koelen
        - entity: <<badkamer.daikin_badkamer_climatecontrol_maandelijks_elektriciteitsverbruik_verwarmen>>
          name: Maandelijks Verbruik verwarmen
        - entity: <<badkamer.daikin_badkamer_climatecontrol_jaarlijks_elektriciteitsverbruik_koelen>>
          name: Jaarlijks Verbruik Koelen
        - entity: <<badkamer.daikin_badkamer_climatecontrol_jaarlijks_elektriciteitsverbruik_verwarmen>>
          name: Jaarlijks Verbruik verwarmen
        state_color: true
        title: Airco Badkamer
        type: entities
      - aggregate_func: max
        entities:
        - <<badkamer.daikin_badkamer_climatecontrol_dagelijks_elektriciteitsverbruik_verwarmen>>
        - <<badkamer.daikin_badkamer_climatecontrol_dagelijks_elektriciteitsverbruik_koelen>>
        group_by: date
        hours_to_show: 168
        show:
          graph: bar
        type: custom:mini-graph-card
  - type: vertical-stack
    cards:
    - type: custom:mushroom-cover-card
      entity: <<badkamer.rolluik_badkamer_links>>
      show_position_control: true
      show_buttons_control: true
      show_tilt_position_control: false
    - type: custom:mushroom-cover-card
      entity: <<badkamer.rolluik_badkamer_rechts>>
      show_position_control: true
      show_buttons_control: true
      show_tilt_position_control: false
    - type: vertical-stack
      cards:
      - card_mod:
          style: "ha-card {\n  --restriction-lock-row-margin-left: 82%;\n  --restriction-regular-lock-color:\
            \ #13269e\n}\n"
        entities:
        - card:
            entity: <<badkamer.smart_plug_handdoekdroger>>
            state_color: true
          row: true
          type: custom:restriction-card
        - entity: <<badkamer.smart_plug_handdoekdroger_power>>
          icon: mdi:counter
          name: Huidig Verbruik
        - entity: <<badkamer.handdoekdroger_daily>>
          name: Dagelijks Verbruik
        - entity: <<badkamer.handdoekdroger_monthly>>
          name: Maandelijks Verbruik
        - entity: <<badkamer.handdoekdroger_yearly>>
          name: Jaarlijks Verbruik
        - entity: <<badkamer.smart_plug_handdoekdroger_energy>>
          icon: mdi:counter
          name: Totaal Verbruik
        state_color: true
        type: entities
      - aggregate_func: max
        entities:
        - <<badkamer.handdoekdroger_daily>>
        group_by: date
        hours_to_show: 168
        name: Handdoekdroger Dagelijks
        show:
          graph: bar
        type: custom:mini-graph-card
  column_span: 3
header:
  layout: responsive
  badges_position: bottom
  badges_wrap: wrap
max_columns: 3
