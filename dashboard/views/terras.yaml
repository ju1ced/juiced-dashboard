# terras view — migrated to committed YAML (PR-19).
# Inline 1:1 lift via scripts/extract_view.py. Stable `path: terras` present ->
# no T4/T7 refactor. card_mod kept verbatim (theme-token pass is PR-38). Any
# household-name keys are neutralized to generic tokens (real ids resolve from
# the git-ignored entities.local.yaml).
theme: Backend-selected
title: terras
path: terras
type: sections
layout:
  max_cols: 4
badges:
- type: custom:decluttering-card
  template: global_navigation_badges
cards: []
sections:
- type: grid
  cards:
  - type: vertical-stack
    cards:
    - type: horizontal-stack
      cards:
      - type: custom:mushroom-light-card
        entity: <<terras.licht_terrasspot>>
        icon: mdi:light-flood-down
        use_light_color: true
      - type: custom:mushroom-light-card
        entity: <<terras.terraslichtjes_3>>
        icon: mdi:string-lights
        use_light_color: true
    - type: horizontal-stack
      cards:
      - type: custom:mushroom-template-card
        primary: spot BBQ buitenkeuken
        icon: mdi:light-flood-down
        tap_action:
          action: toggle
        icon_color: "{% if is_state('<<terras.licht_bbq_buitenkeuken>>', 'on') %}\n  orange\n{% endif\
          \ %}"
        entity: <<terras.licht_bbq_buitenkeuken>>
      - type: custom:mushroom-template-card
        primary: Buitenkeuken lichtjes
        icon: mdi:string-lights
        icon_color: "{% if is_state('<<terras.bbq_buitenkeuken_lichtjes>>', 'on') %}\n  orange\n{% endif\
          \ %}"
        tap_action:
          action: toggle
        entity: <<terras.bbq_buitenkeuken_lichtjes>>
        secondary: ''
    - type: horizontal-stack
      cards:
      - type: custom:mushroom-light-card
        use_light_color: true
        entity: <<terras.tuinhuislichtjes_lichtjes_tuinhuis>>
        icon: phu:light-string
      - type: custom:mushroom-light-card
        use_light_color: true
        entity: <<terras.licht_tuinhuis>>
        icon: mdi:lightbulb
    - type: horizontal-stack
      cards:
      - type: custom:mushroom-light-card
        entity: <<terras.terraslichtjes_kleur>>
        use_light_color: true
        show_brightness_control: true
        show_color_temp_control: true
        collapsible_controls: true
        show_color_control: true
      - type: custom:mushroom-light-card
        entity: <<terras.licht_boom>>
        icon: phu:stage-uplight
    - type: custom:mushroom-cover-card
      entity: <<terras.luifel_terras>>
      show_position_control: true
      show_buttons_control: true
      show_tilt_position_control: false
    - type: horizontal-stack
      cards:
      - type: conditional
        conditions:
        - condition: state
          entity: <<terras.luifel_bureau_luifel_bureau>>
          state: closed
        card:
          type: custom:mushroom-cover-card
          entity: <<terras.luifel_bureau_luifel_bureau>>
          show_position_control: false
          show_buttons_control: false
          show_tilt_position_control: false
          tap_action:
            action: call-service
            service: cover.set_cover_position
            target:
              entity_id: <<terras.luifel_bureau_luifel_bureau>>
            data:
              position: 40
      - type: conditional
        conditions:
        - condition: state
          entity: <<terras.luifel_bureau_luifel_bureau>>
          state: closing
        card:
          type: custom:mushroom-cover-card
          entity: <<terras.luifel_bureau_luifel_bureau>>
          show_position_control: false
          show_buttons_control: false
          show_tilt_position_control: false
          tap_action:
            action: none
          hold_action:
            action: none
          double_tap_action:
            action: none
      - type: conditional
        conditions:
        - condition: state
          entity: <<terras.luifel_bureau_luifel_bureau>>
          state: open
        card:
          type: custom:mushroom-cover-card
          entity: <<terras.luifel_bureau_luifel_bureau>>
          show_position_control: false
          show_buttons_control: false
          show_tilt_position_control: false
          tap_action:
            action: call-service
            service: cover.close_cover
            target:
              entity_id:
              - <<terras.luifel_bureau_luifel_bureau>>
      - type: conditional
        conditions:
        - condition: state
          entity: <<terras.luifel_bureau_luifel_bureau>>
          state: opening
        card:
          type: custom:mushroom-cover-card
          entity: <<terras.luifel_bureau_luifel_bureau>>
          show_position_control: false
          show_buttons_control: false
          show_tilt_position_control: false
          tap_action:
            action: none
          hold_action:
            action: none
          double_tap_action:
            action: none
    - type: custom:mini-media-player
      speaker_group:
        platform: sonos
        show_group_count: true
        entities:
        - entity_id: <<terras.keuken>>
          name: Sonos keuken
        - entity_id: <<terras.living>>
          name: Sonos Living
        - entity_id: <<terras.kantoor>>
          name: Sonos kantoor
        - entity_id: <<terras.badkamer>>
          name: Sonos badkamer
        - entity_id: <<terras.slaapkamer>>
          name: Sonos Slaapkamer
        - entity_id: <<terras.bbq_buitenkeuken>>
          name: Sonos BBQ buitenkeuken
        - entity_id: <<terras.tuinhuis>>
          name: Sonos Tuinhuis
      artwork: cover
      source: icon
      sound_mode: icon
      info: scroll
      entity: <<terras.tuinhuis>>
    - type: custom:mini-media-player
      speaker_group:
        platform: sonos
        show_group_count: true
        entities:
        - entity_id: <<terras.keuken>>
          name: Sonos keuken
        - entity_id: <<terras.living>>
          name: Sonos Living
        - entity_id: <<terras.kantoor>>
          name: Sonos kantoor
        - entity_id: <<terras.badkamer>>
          name: Sonos badkamer
        - entity_id: <<terras.slaapkamer>>
          name: Sonos Slaapkamer
        - entity_id: <<terras.bbq_buitenkeuken>>
          name: Sonos BBQ buitenkeuken
        - entity_id: <<terras.tuinhuis>>
          name: Sonos Tuinhuis
      artwork: cover
      source: icon
      sound_mode: icon
      info: scroll
      entity: <<terras.bbq_buitenkeuken>>
    - type: custom:mini-media-player
      artwork: cover
      name: Sonos Living
      source: icon
      sound_mode: icon
      info: scroll
      speaker_group:
        platform: sonos
        show_group_count: true
        entities:
        - entity_id: <<terras.keuken>>
          name: Sonos keuken
        - entity_id: <<terras.living>>
          name: Sonos Living
        - entity_id: <<terras.kantoor>>
          name: Sonos kantoor
        - entity_id: <<terras.badkamer>>
          name: Sonos badkamer
        - entity_id: <<terras.slaapkamer>>
          name: Sonos Slaapkamer
        - entity_id: <<terras.bbq_buitenkeuken>>
          name: Sonos BBQ buitenkeuken
        - entity_id: <<terras.tuinhuis>>
          name: Sonos Tuinhuis
      entity: <<terras.living>>
    - card:
        cards:
        - entities:
          - buttons:
            - entity: <<terras.tx_nr656>>
              layout: icon_state
              state_icons:
                'off': mdi:cast
                'on': mdi:cast-audio
              state_styles:
                'off':
                  button:
                    color: teal
                'on':
                  button:
                    color: green
              state_text:
                'off': Sonos Lving staat uit
                'on': Sonos speelt in de living
              tap_action:
                action: call-service
                service: script.sonos_living_on
            type: custom:paper-buttons-row
          type: entities
        - entities:
          - buttons:
            - entity: <<terras.tx_nr656_zone_2>>
              layout: icon_state
              state_icons:
                'off': mdi:cast
                'on': mdi:cast-audio
              state_styles:
                'off':
                  button:
                    color: teal
                'on':
                  button:
                    color: green
              state_text:
                'off': Sonos Terras staat uit
                'on': Sonos speelt op het terras
              tap_action:
                action: call-service
                service: script.sonos_living_on_2
            type: custom:paper-buttons-row
          type: entities
        type: horizontal-stack
      style: "ha-card {\n  background: var( --ha-card-background, var(--card-background-color, white)\
        \ );\n  border-radius: var(--ha-card-border-radius, 4px);\n  box-shadow: var( --ha-card-box-shadow,\
        \ 0px 2px 1px -1px rgba(0, 0, 0, 0.2), 0px 1px 1px 0px rgba(0, 0, 0, 0.14), 0px 1px 3px 0px rgba(0,\
        \ 0, 0, 0.12) );\n}\nh1 {\n  color: red !important;\n}\n"
      type: custom:mod-card
    - type: custom:stack-in-card
      cards:
      - type: grid
        square: false
        columns: 2
        cards:
        - type: custom:mushroom-entity-card
          entity: <<terras.ht_buitenkeuken_temperatuur>>
          primary_info: state
          secondary_info: name
          name: Temperatuur
          icon_color: green
        - type: custom:mushroom-entity-card
          entity: <<terras.ht_buitenkeuken_luchtvochtigheid>>
          primary_info: state
          secondary_info: name
          name: Vochtigheidsgraad
          icon_color: blue
      - type: custom:mini-graph-card
        entities:
        - entity: <<terras.ht_buitenkeuken_temperatuur>>
          name: Temperatuur
          color: '#00bb33'
        - entity: <<terras.ht_buitenkeuken_luchtvochtigheid>>
          name: Vochtigheidsgraad
          color: '#2196f3'
          y_axis: secondary
        hours_to_show: 72
        line_width: 3
        font_size: 50
        animate: true
        show:
          name: false
          icon: false
          state: false
          legend: false
          fill: fade
    - type: custom:stack-in-card
      cards:
      - type: grid
        square: false
        columns: 2
        cards:
        - type: custom:mushroom-entity-card
          entity: <<terras.bewegingssensor_terras_temperature>>
          primary_info: state
          secondary_info: name
          name: Temperatuur Terras
          icon_color: green
        - type: custom:mushroom-entity-card
          entity: <<terras.bewegingssensor_tuinhuis_temperature>>
          primary_info: state
          secondary_info: name
          name: Temperatuur Tuinhuis
          icon_color: blue
      - type: custom:mini-graph-card
        entities:
        - entity: <<terras.bewegingssensor_terras_temperature>>
          name: Temperatuur
          color: '#00bb33'
        - entity: <<terras.bewegingssensor_tuinhuis_temperature>>
          name: Temperatuur
          color: '#2196f3'
        hours_to_show: 72
        line_width: 3
        font_size: 50
        animate: true
        show:
          name: false
          icon: false
          state: false
          legend: false
          fill: fade
    - type: custom:stack-in-card
      cards:
      - type: grid
        square: false
        columns: 2
        cards:
        - type: custom:mushroom-entity-card
          entity: <<terras.ht_terraskast_temperatuur>>
          primary_info: state
          secondary_info: name
          name: Temperatuur Terras
          icon_color: green
        - type: custom:mushroom-entity-card
          entity: <<terras.ht_terraskast_luchtvochtigheid>>
          primary_info: state
          secondary_info: name
          name: Temperatuur Tuinhuis
          icon_color: blue
      - type: custom:mini-graph-card
        entities:
        - entity: <<terras.ht_terraskast_temperatuur>>
          name: Temperatuur
          color: '#00bb33'
        - entity: <<terras.ht_terraskast_luchtvochtigheid>>
          name: Temperatuur
          color: '#2196f3'
        hours_to_show: 72
        line_width: 3
        font_size: 50
        animate: true
        show:
          name: false
          icon: false
          state: false
          legend: false
          fill: fade
  - type: vertical-stack
    cards:
    - show_state: true
      show_name: true
      camera_view: auto
      fit_mode: cover
      type: picture-entity
      entity: <<terras.tuin_high_resolution_channel>>
      image:
        media_content_id: https://demo.home-assistant.io/stub_config/bedroom.png
    - show_state: true
      show_name: true
      camera_view: auto
      fit_mode: cover
      type: picture-entity
      image:
        media_content_id: https://demo.home-assistant.io/stub_config/bedroom.png
      entity: <<terras.tuinhuis_high_resolution_channel>>
    - type: custom:stack-in-card
      cards:
      - type: grid
        square: false
        columns: 2
        cards:
        - type: custom:mushroom-entity-card
          entity: <<terras.bewegingssensor_terras_temperature>>
          primary_info: state
          secondary_info: name
          name: Temperatuur
          icon_color: green
        - type: custom:mushroom-entity-card
          entity: <<terras.bewegingssensor_tuinhuis_temperature>>
          primary_info: state
          secondary_info: name
          name: Temperatuur
          icon_color: blue
      - type: custom:mini-graph-card
        entities:
        - entity: <<terras.bewegingssensor_terras_temperature>>
          name: Temperatuur
          color: '#00bb33'
        - entity: <<terras.bewegingssensor_tuinhuis_temperature>>
          name: Temperatuur
          color: '#2196f3'
        hours_to_show: 72
        line_width: 3
        font_size: 50
        animate: true
        show:
          name: false
          icon: false
          state: false
          legend: false
          fill: fade
    - card:
        cards:
        - cards:
          - entities:
            - buttons:
              - entity: <<terras.bewegingssensor_terras_occupancy>>
                layout: icon|state
                state_icons:
                  'off': mdi:motion-sensor-off
                  'on': mdi:motion-sensor
                state_styles:
                  'off':
                    button:
                      border-radius: 10px
                      color: green
                  'on':
                    button:
                      border-radius: 10px
                      color: red
                state_text:
                  'off': Geen beweging (terras)
                  'on': beweging gedetecteerd (terras)
              type: custom:paper-buttons-row
            type: entities
          - entities:
            - attribute: battery_percent
              critical: 25
              entity: <<terras.bewegingssensor_terras_battery>>
              name: Motion Terras
              type: custom:battery-entity-row
              unit: '%'
              warning: 50
            type: entities
          - entities:
            - buttons:
              - entity: <<terras.bewegingssensor_tuinhuis_occupancy>>
                layout: icon|state
                state_icons:
                  'off': mdi:motion-sensor-off
                  'on': mdi:motion-sensor
                state_styles:
                  'off':
                    button:
                      border-radius: 10px
                      color: green
                  'on':
                    button:
                      border-radius: 10px
                      color: red
                state_text:
                  'off': Geen beweging (tuinhuis)
                  'on': beweging gedetecteerd (tuinhuis)
              type: custom:paper-buttons-row
            type: entities
          - entities:
            - attribute: battery_percent
              critical: 25
              entity: <<terras.bewegingssensor_tuinhuis_battery>>
              name: Motion Tuinhuis
              type: custom:battery-entity-row
              unit: '%'
              warning: 50
            type: entities
          columns: 2
          square: false
          type: grid
        - cards:
          - entities:
            - buttons:
              - entity: <<terras.tomorrow_io_temperatuur>>
                layout: icon|state|name
                name: °C
                styles:
                  button:
                    border-radius: 10px
                    color: green
              type: custom:paper-buttons-row
            type: entities
          - entities:
            - buttons:
              - entity: <<terras.tomorrow_io_windsnelheid>>
                layout: icon|state|name
                name: km/u
                styles:
                  button:
                    border-radius: 10px
                    color: green
              type: custom:paper-buttons-row
            type: entities
          columns: 2
          square: false
          type: grid
        - cards:
          - entities:
            - buttons:
              - entity: <<terras.tomorrow_io_vochtigheidsgraad>>
                layout: icon|state|name
                name: '%'
                styles:
                  button:
                    border-radius: 10px
                    color: green
              type: custom:paper-buttons-row
            type: entities
          - entities:
            - buttons:
              - entity: <<terras.tomorrow_io_household_home_cloud_cover>>
                layout: icon|state|name
                name: '%'
                icon: mdi:cloud
                styles:
                  button:
                    border-radius: 10px
                    color: green
              type: custom:paper-buttons-row
            type: entities
          columns: 2
          square: false
          type: grid
        - cards: null
          type: picture-entity
          entity: <<terras.buienradar>>
        type: vertical-stack
      type: custom:mod-card
      style: "ha-card {\n  background: var( --ha-card-background, var(--card-background-color, white)\
        \ );\n  border-radius: var(--ha-card-border-radius, 4px);\n  box-shadow: var( --ha-card-box-shadow,\
        \ 0px 2px 1px -1px rgba(0, 0, 0, 0.2), 0px 1px 1px 0px rgba(0, 0, 0, 0.14), 0px 1px 3px 0px rgba(0,\
        \ 0, 0, 0.12) );\n}\nh1 {\n  color: red !important;\n}\n\nh1 {\n  color: red !important;\n}\n"
  - type: vertical-stack
    cards:
    - type: custom:rain-gauge-card
      language: nl
      hourly_rate_entity: <<terras.regenmodule_neerslag>>
      entity: <<terras.regenmodule_neerslag_vandaag>>
      name: Regen
      show_error: false
      show_warning: false
    - type: custom:apexcharts-card
      apex_config:
        chart:
          height: 250px
        legend:
          show: true
      graph_span: 24h
      header:
        show: false
        title: ApexCharts-Card
        colorize_states: true
      all_series_config:
        stroke_width: 3
        opacity: 0.3
        type: area
      series:
      - entity: <<terras.windmeter_windsnelheid>>
      - entity: <<terras.windmeter_windstoot_sterkte>>
    - type: custom:windrose-card
      title: Wind direction
      data_period:
        hours_to_show: 24
      max_width: 400
      windspeed_bar_full: true
      wind_direction_entity:
        entity: <<terras.windmeter_windstoot_hoek>>
      windspeed_entities:
      - entity: <<terras.windmeter_windstoot_sterkte>>
        name: Average
      speed_range_beaufort: false
      output_speed_unit: kph
      speed_range_step: 5
      speed_range_max: 80
  - type: vertical-stack
    cards:
    - type: custom:apexcharts-card
      header:
        show: true
        title: Rain - Last month
        show_states: false
      series:
      - entity: <<terras.regenmodule_neerslag_vandaag>>
        type: column
        opacity: 0.7
        color: lightblue
        group_by:
          duration: 1d
          func: max
      graph_span: 30d
      update_interval: 5m
    - type: vertical-stack
      cards:
      - type: vertical-stack
        cards:
        - entities:
          - card:
              entity: <<terras.bbq_buitenkeuken_zwembad>>
              state_color: true
            row: true
            type: custom:restriction-card
          - entity: <<terras.bbq_buitenkeuken_zwembad_vermogen>>
            icon: mdi:counter
          - entity: <<terras.buitenkeuken_daily>>
            icon: mdi:counter
            name: Dagelijks Verbruik
          - entity: <<terras.buitenkeuken_monthly>>
            name: Maandelijks verbruik
          - entity: <<terras.buitenkeuken_yearly>>
            name: Jaarlijks verbruik
          - entity: <<terras.bbq_buitenkeuken_zwembad_energie>>
            icon: mdi:counter
          state_color: true
          type: entities
          card_mod:
            style: "ha-card {\n  --restriction-lock-row-margin-left: 82%;\n  --restriction-regular-lock-color:\
              \ #13269e\n}\n"
        - aggregate_func: max
          entities:
          - <<terras.buitenkeuken_daily>>
          group_by: date
          hours_to_show: 168
          show:
            graph: bar
          type: custom:mini-graph-card
  column_span: 4
header:
  layout: responsive
  badges_position: bottom
  badges_wrap: wrap
max_columns: 4
