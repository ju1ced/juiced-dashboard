# slaapkamer view — migrated to committed YAML (PR-10).
# Inline 1:1 lift via scripts/extract_view.py (rich room: 3 lights, 2 covers,
# thermostat, mini-media-player, sensor/battery grid). Round-trip render
# deep-equals the default view (0 diffs). Stable `path: slaapkamer` already
# present -> no T4/T7 refactor. card_mod/mod-card kept verbatim (theme-token
# pass is PR-38). Real IDs resolve from the git-ignored entities.local.yaml.
theme: Juiced Horizon
title: slaapkamer
path: slaapkamer
type: sections
badges:
- type: custom:decluttering-card
  template: global_navigation_badges
cards: []
sections:
- type: grid
  cards:
  - type: vertical-stack
    cards:
    - square: false
      columns: 3
      type: grid
      cards:
      - type: custom:mushroom-light-card
        entity: <<slaapkamer.nachtlampje_2>>
        name: Persoon 1
        icon: mdi:lamp-outline
        use_light_color: true
        show_brightness_control: true
        collapsible_controls: true
        fill_container: true
      - type: custom:mushroom-light-card
        entity: <<slaapkamer.smart_plug_nachtlampje_person_2>>
        name: Persoon 2
        icon: mdi:lamp
        collapsible_controls: false
        use_light_color: true
        fill_container: true
      - type: custom:mushroom-light-card
        entity: <<slaapkamer.dressing>>
        fill_container: true
        use_light_color: true
        collapsible_controls: true
        show_brightness_control: true
        icon: mdi:vanity-light
    - control:
      - hvac
      - preset
      - fan
      - swing
      entity: <<slaapkamer.daikin_slaapkamer_room_temperature>>
      header: false
      label:
        temperature: temperatuur
      hide:
        state: false
        temperature: false
      layout:
        mode:
          headings: false
          icons: true
          names: true
        sensors:
          labels: true
        step: row
      type: custom:simple-thermostat
    - card:
        cards:
        - cards:
          - entities:
            - buttons:
              - entity: <<slaapkamer.ht_slaapkamer_temperatuur>>
                layout: icon|state|name
                name: °C
                styles:
                  button:
                    border-radius: 10px
                    color: green
              type: custom:paper-buttons-row
            type: entities
          - entities:
            - buttons:
              - entity: <<slaapkamer.ht_slaapkamer_luchtvochtigheid>>
                layout: icon|state|name
                name: '%'
                styles:
                  button:
                    border-radius: 10px
                    color: green
              type: custom:paper-buttons-row
            type: entities
          - entities:
            - buttons:
              - entity: <<slaapkamer.ht_slaapkamer_kooldioxide>>
                layout: icon|state|name
                icon: mdi:molecule-co2
                name: ppm
                styles:
                  button:
                    border-radius: 10px
                    color: green
              type: custom:paper-buttons-row
            type: entities
          - entities:
            - buttons:
              - entity: <<slaapkamer.bewegingsmelder_slaapkamer_licht>>
                layout: icon|state|name
                icon: mdi:brightness-5
                name: lux
                styles:
                  button:
                    border-radius: 10px
                    color: green
              type: custom:paper-buttons-row
            type: entities
          - entities:
            - buttons:
              - entity: <<slaapkamer.bewegingsmelder_slaapkamer_beweging>>
                layout: icon|state
                state_icons:
                  'off': mdi:motion-sensor-off
                  'on': mdi:motion-sensor
                state_styles:
                  'off':
                    button:
                      color: green
                  'on':
                    button:
                      color: red
                state_text:
                  'off': slaapkamer
                  'on': slaapkamer
                styles:
                  button:
                    border-radius: 10px
                    color: green
              type: custom:paper-buttons-row
            type: entities
          - entities:
            - buttons:
              - entity: <<slaapkamer.raamsensor_slaapkamer_raam>>
                layout: icon|state
                state_icons:
                  'off': mdi:window-closed
                  'on': mdi:window-open
                state_styles:
                  'off':
                    button:
                      color: green
                  'on':
                    button:
                      color: red
                state_text:
                  'off': raam gesloten
                  'on': raam open
                name: ''
                styles:
                  button:
                    border-radius: 10px
                    color: green
              type: custom:paper-buttons-row
            type: entities
          - entities:
            - buttons:
              - entity: <<slaapkamer.raamsensor_slaapkamer_licht>>
                layout: icon|state|name
                icon: mdi:brightness-5
                name: lux
                styles:
                  button:
                    border-radius: 10px
                    color: green
              type: custom:paper-buttons-row
            type: entities
          - entities:
            - buttons:
              - entity: <<slaapkamer.raamsensor_slaapkamer_rotation>>
                layout: icon|state|name
                name: °
                icon: mdi:rotate-3d
                styles:
                  button:
                    border-radius: 10px
                    color: green
              type: custom:paper-buttons-row
            type: entities
          - entities:
            - attribute: battery_percent
              critical: 25
              entity: <<slaapkamer.bewegingsmelder_slaapkamer_batterij>>
              name: motion
              type: custom:battery-entity-row
              unit: '%'
              warning: 50
            type: entities
          - entities:
            - attribute: battery_percent
              critical: 25
              entity: <<slaapkamer.raamsensor_slaapkamer_batterij>>
              name: raam
              type: custom:battery-entity-row
              unit: '%'
              warning: 50
            type: entities
          columns: 2
          square: false
          type: grid
        type: vertical-stack
      type: custom:mod-card
      style: "ha-card {\n  background: var( --ha-card-background, var(--card-background-color, white)\
        \ );\n  border-radius: var(--ha-card-border-radius, 4px);\n  box-shadow: var( --ha-card-box-shadow,\
        \ 0px 2px 1px -1px rgba(0, 0, 0, 0.2), 0px 1px 1px 0px rgba(0, 0, 0, 0.14), 0px 1px 3px 0px rgba(0,\
        \ 0, 0, 0.12) );\n}\nh1 {\n  color: red !important;\n}\n"
    - type: custom:mushroom-template-card
      entity: <<slaapkamer.rookmelder_slaapkamer_rook>>
      tap_action:
        action: more-info
      icon: "{% if is_state('<<slaapkamer.rookmelder_slaapkamer_rook>>', 'on') %}\n  mdi:smoke-detector-alert\n\
        {% else %}\n  mdi:smoke-detector\n{% endif %}\n"
      multiline_secondary: true
      primary: Slaapkamer
      badge_color: ''
      secondary: '{{states(''<<slaapkamer.rookmelder_slaapkamer_batterij>>'')}} %    '
      features_position: bottom
      card_mod:
        style:
          mushroom-shape-icon$: ".shape {\n  --shape-color: {{ 'var(--juiced-chip-ok, rgba(67, 138, 94, 0.7))' if is_state('<<slaapkamer.rookmelder_slaapkamer_rook>>',\
            \ 'off') else 'var(--juiced-chip-alert, rgba(230, 118, 118, 0.7))' }};;\n  --icon-color: black;\n"
  - type: vertical-stack
    cards:
    - type: custom:mushroom-cover-card
      entity: <<slaapkamer.rolluik_slaapkamer_links>>
      show_position_control: true
      show_buttons_control: true
      show_tilt_position_control: false
    - type: custom:mushroom-cover-card
      entity: <<slaapkamer.rolluik_slaapkamer_rechts>>
      show_position_control: true
      show_buttons_control: true
      show_tilt_position_control: false
    - type: custom:mini-media-player
      speaker_group:
        platform: sonos
        show_group_count: true
        entities:
        - entity_id: <<slaapkamer.keuken>>
          name: Sonos keuken
        - entity_id: <<slaapkamer.living>>
          name: Sonos Living
        - entity_id: <<slaapkamer.kantoor>>
          name: Sonos kantoor
        - entity_id: <<slaapkamer.badkamer>>
          name: Sonos badkamer
        - entity_id: <<slaapkamer.slaapkamer>>
          name: Sonos Slaapkamer
        - entity_id: <<slaapkamer.bbq_buitenkeuken>>
          name: Sonos BBQ buitenkeuken
        - entity_id: <<slaapkamer.tuinhuis>>
          name: Sonos Tuinhuis
      artwork: cover
      source: icon
      sound_mode: icon
      info: scroll
      entity: <<slaapkamer.slaapkamer>>
    - type: custom:decluttering-card
      template: sensor_graph_mini
      variables:
      - temp_entity: <<slaapkamer.ht_slaapkamer_temperatuur>>
      - humidity_entity: <<slaapkamer.ht_slaapkamer_luchtvochtigheid>>
    - type: custom:decluttering-card
      template: air_quality_mini
      variables:
      - co2_entity: <<slaapkamer.ht_slaapkamer_kooldioxide>>
  - type: vertical-stack
    cards:
    - card_mod:
        style: "ha-card {\n  --restriction-lock-row-margin-left: 82%;\n  --restriction-regular-lock-color:\
          \ #13269e\n}\n"
      entities:
      - entity: <<slaapkamer.daikin_slaapkamer_climatecontrol_dagelijks_elektriciteitsverbruik_koelen>>
        name: Dagelijks Verbruik Koelen
      - entity: <<slaapkamer.daikin_slaapkamer_climatecontrol_dagelijks_elektriciteitsverbruik_verwarmen>>
        name: Dagelijks Verbruik Verwarmen
      - entity: <<slaapkamer.daikin_slaapkamer_climatecontrol_maandelijks_elektriciteitsverbruik_koelen>>
        name: Maandelijks Verbruik Koelen
      - entity: <<slaapkamer.daikin_slaapkamer_climatecontrol_maandelijks_elektriciteitsverbruik_verwarmen>>
        name: Maandelijks Verbruik verwarmen
      - entity: <<slaapkamer.daikin_slaapkamer_climatecontrol_jaarlijks_elektriciteitsverbruik_koelen>>
        name: Jaarlijks Verbruik Koelen
      - entity: <<slaapkamer.daikin_slaapkamer_climatecontrol_jaarlijks_elektriciteitsverbruik_verwarmen>>
        name: Jaarlijks Verbruik verwarmen
      state_color: true
      title: Airco Slaapkamer
      type: entities
    - aggregate_func: max
      entities:
      - <<slaapkamer.daikin_slaapkamer_climatecontrol_dagelijks_elektriciteitsverbruik_verwarmen>>
      - <<slaapkamer.daikin_slaapkamer_climatecontrol_dagelijks_elektriciteitsverbruik_koelen>>
      group_by: date
      hours_to_show: 168
      show:
        graph: bar
      type: custom:mini-graph-card
  column_span: 3
max_columns: 3
header:
  layout: responsive
  badges_position: bottom
  badges_wrap: wrap
