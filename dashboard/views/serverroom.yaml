# serverroom view — migrated to committed YAML (PR-18).
# Inline 1:1 lift via scripts/extract_view.py. Stable `path: serverroom` present ->
# no T4/T7 refactor. card_mod kept verbatim (theme-token pass is PR-38). Any
# household-name keys are neutralized to generic tokens (real ids resolve from
# the git-ignored entities.local.yaml).
theme: Juiced Horizon
title: serverroom
type: sections
badges:
- type: custom:decluttering-card
  template: global_navigation_badges
cards: []
sections:
- type: grid
  cards:
  - type: vertical-stack
    cards:
    - type: horizontal-stack
      cards:
      - type: custom:mushroom-light-card
        entity: <<serverroom.licht_serverroom>>
        icon: mdi:ceiling-light
        fill_container: true
      - type: custom:mushroom-light-card
        entity: <<serverroom.ledstrip_serverroom_beneden>>
        icon: mdi:led-strip
        use_light_color: true
        show_color_control: true
        show_brightness_control: true
        show_color_temp_control: true
      - type: custom:mushroom-light-card
        entity: <<serverroom.ledstrip_serverroom_1>>
        icon: mdi:led-strip
        use_light_color: true
        show_color_control: true
        show_brightness_control: true
        show_color_temp_control: true
    - card:
        cards:
        - cards:
          - entities:
            - buttons:
              - entity: <<serverroom.serverroom_beweging>>
                layout: icon|state
                state_icons:
                  'off': mdi:motion-sensor-off
                  'on': mdi:motion-sensor
                state_styles:
                  'off':
                    button:
                      border-radius: 10px
                      color: green
                  'on':
                    button:
                      border-radius: 10px
                      color: red
                state_text:
                  'off': Geen beweging
                  'on': beweging gedetecteerd
              type: custom:paper-buttons-row
            type: entities
          - entities:
            - buttons:
              - entity: <<serverroom.multisensor_serverroom_new_temperature>>
                layout: icon|state|name
                name: °C
                styles:
                  button:
                    border-radius: 10px
                    color: green
              type: custom:paper-buttons-row
            type: entities
          - entities:
            - buttons:
              - entity: <<serverroom.multisensor_serverroom_new_humidity>>
                layout: icon|state|name
                name: '%'
                styles:
                  button:
                    border-radius: 10px
                    color: green
              type: custom:paper-buttons-row
            type: entities
          - entities:
            - attribute: battery_percent
              critical: 25
              entity: <<serverroom.multisensor_serverroom_new_battery>>
              name: Multisensor
              type: custom:battery-entity-row
              unit: '%'
              warning: 50
            type: entities
          columns: 2
          square: false
          type: grid
        type: vertical-stack
      type: custom:mod-card
      style: "ha-card {\n  background: var( --ha-card-background, var(--card-background-color, white)\
        \ );\n  border-radius: var(--ha-card-border-radius, 4px);\n  box-shadow: var( --ha-card-box-shadow,\
        \ 0px 2px 1px -1px rgba(0, 0, 0, 0.2), 0px 1px 1px 0px rgba(0, 0, 0, 0.14), 0px 1px 3px 0px rgba(0,\
        \ 0, 0, 0.12) );\n}\nh1 {\n  color: red !important;\n}\n"
    - square: false
      columns: 1
      type: grid
      cards:
      - show_state: true
        show_name: true
        camera_view: auto
        fit_mode: cover
        type: picture-entity
        image:
          media_content_id: https://demo.home-assistant.io/stub_config/bedroom.png
        entity: <<serverroom.serverroom_high_resolution_channel>>
    - type: custom:stack-in-card
      cards:
      - type: grid
        square: false
        columns: 2
        cards:
        - type: custom:mushroom-entity-card
          entity: <<serverroom.multisensor_serverroom_new_temperature>>
          primary_info: state
          secondary_info: name
          name: Temperatuur
          icon_color: green
        - type: custom:mushroom-entity-card
          entity: <<serverroom.multisensor_serverroom_new_humidity>>
          primary_info: state
          secondary_info: name
          name: Vochtigheidsgraad
          icon_color: blue
      - type: custom:mini-graph-card
        entities:
        - entity: <<serverroom.multisensor_serverroom_new_temperature>>
          name: Temperatuur
          color: '#00bb33'
        - entity: <<serverroom.multisensor_serverroom_new_humidity>>
          name: Vochtigheidsgraad
          color: '#2196f3'
          y_axis: secondary
        hours_to_show: 72
        line_width: 3
        font_size: 50
        animate: true
        show:
          name: false
          icon: false
          state: false
          legend: false
          fill: fade
  - type: vertical-stack
    cards:
    - type: horizontal-stack
      cards:
      - type: custom:mushroom-chips-card
        chips:
        - type: template
          icon: mdi:information
          icon_color: blue
          content: '

            {{states(''<<serverroom.anycubic_kobra_s1_current_status>>'')}} / {{states(''<<serverroom.anycubic_kobra_s1_job_state>>'')}}'
          tap_action:
            action: more-info
          entity: <<serverroom.anycubic_kobra_s1_current_status>>
        - type: entity
          entity: <<serverroom.anycubic_kobra_s1_vermogen>>
          icon_color: blue
          tap_action:
            action: more-info
        - type: template
          tap_action:
            action: more-info
