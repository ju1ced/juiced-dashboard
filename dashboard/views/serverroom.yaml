      - type: markdown
        content: <ha-icon icon="mdi:file"></ha-icon> {{states('<<serverroom.anycubic_kobra_s1_job_name>>')}}
      - square: false
        type: grid
        cards:
        - type: custom:mushroom-template-card
          primary: '{{states(''<<serverroom.anycubic_kobra_s1_job_current_layer>>'')}}/{{states(''<<serverroom.anycubic_kobra_s1_job_total_layers>>'')}}'
          icon: mdi:layers
          color: blue
          features_position: bottom
        - type: tile
          entity: <<serverroom.anycubic_kobra_s1_job_progress>>
          features_position: bottom
          vertical: false
          icon: mdi:progress-download
          color: blue
          name: Progress
        - type: custom:mushroom-entity-card
