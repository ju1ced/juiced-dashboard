            {{states(''<<serverroom.anycubic_kobra_s1_hotbed_temperature>>'')}}° / {{states(''<<serverroom.anycubic_kobra_s1_target_hotbed_temperature>>'')}}°'
        - type: template
          tap_action:
            action: more-info
          entity: <<serverroom.anycubic_kobra_s1_nozzle_temperature>>
          icon: mdi:printer-3d-nozzle-heat
