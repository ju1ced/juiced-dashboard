            \ %}\n{% if eta_time | timestamp_custom('%Y-%m-%d') == now().strftime('%Y-%m-%d') %}\n  {{eta_time\
            \ | timestamp_custom('%H:%M')}}\n{% else %}\n  {{eta_time | timestamp_custom('%d/%m %H:%M')}}\n\
            {% endif %}"
          color: blue
          features_position: bottom
        - type: custom:mushroom-entity-card
