            {{states(''<<serverroom.anycubic_kobra_s1_nozzle_temperature>>'')}}° / {{states(''<<serverroom.anycubic_kobra_s1_target_nozzle_temperature>>'')}}°'
    - type: custom:anycubic-card
      printer_id: 1a3fcce1a5e381e258925e19cbf667f5
      monitoredStats:
      - Status
      - ETA
      - Elapsed
      - Remaining
      slotColors: []
      powerEntityId: <<serverroom.anycubic_kobra_s1>>
      cameraEntityId: <<serverroom.kobra_s1_webcam>>
      alwaysShow: true
      showSettingsButton: true
      lightEntityId: <<serverroom.ledstrip_serverroom_beneden>>
    - type: vertical-stack
