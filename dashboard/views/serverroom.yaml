          name: Kobra S1 Temp
        - type: custom:mushroom-entity-card
          entity: <<serverroom.ht_kobra_s1_luchtvochtigheid>>
          icon_color: blue
          name: 'Kobra S1 Humidity '
        - type: custom:mushroom-entity-card
          entity: <<serverroom.ht_ace_pro_bottom_temperatuur>>
          name: ACE Pro Bottom Temp
        - type: custom:mushroom-entity-card
          entity: <<serverroom.ht_ace_pro_bottom_luchtvochtigheid>>
          icon_color: blue
          name: 'ACE Pro Bottom Humidity '
        - type: custom:mushroom-entity-card
          entity: <<serverroom.ht_ace_pro_top_temperatuur>>
          name: ACE Pro Top Temp
        - type: custom:mushroom-entity-card
          entity: <<serverroom.ht_ace_pro_top_luchtvochtigheid>>
          icon_color: blue
          name: 'ACE Pro Top Humidity '
        columns: 2
