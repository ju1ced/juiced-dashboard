  - type: vertical-stack
    cards:
    - type: custom:expander-card
      title-card-clickable: true
      expanded: true
      min-width-expanded: 1024
      title-card-button-overlay: true
      expanded-gap: 1em
      padding: 0px
      child-margin-top: 0.5em
      expander-card-background: transparent
      expander-card-background-expanded: transparent
      title: PLA / PLA+
      title-card:
        name: PLA / PLA+
        styles:
          card:
          - padding: 2% 0px
          - font-size: 125%
          - border-radius: 0%
          - font-weight: 100
          - letter-spacing: 3px
          - --mdc-ripple-press-opacity: 0
          - cursor: initial
          name:
          - font-weight: 900
        type: custom:button-card
      cards:
      - type: custom:auto-entities
        filter:
          include:
          - integration: '*spoolman*'
            attributes:
              archived: false
              filament_material: PLA
            options:
              type: custom:mushroom-template-card
              vertical: false
              icon_color: '#{{ state_attr(entity, ''filament_color_hex'') }}'
              icon: mdi:printer-3d-nozzle
              badge_icon: "{% if state_attr(entity, 'archived') == true %}\n  mdi:archive\n{% elif state_attr(entity,\
                \ 'klipper_active_spool') == true %}\n  mdi:check-circle\n{% endif %}\n"
              badge_color: "{% if state_attr(entity, 'archived') == true %}\n  orange\n{% elif state_attr(entity,\
                \ 'klipper_active_spool') == true %}\n  green\n{% else %}\n  default_color\n{% endif %}\n"
              primary: "{% set location = state_attr(entity, 'location') %}\n{% if location %}\n  {{ state_attr(entity,\
                \ 'filament_name') }} ({{ location }})\n{% else %}\n  {{ state_attr(entity, 'filament_material')\
                \ }} - {{ state_attr(entity, 'filament_name') }}\n{% endif %}\n"
              secondary: '{{ (state_attr(entity, ''remaining_weight'') | float(0))  | round(2) }} g'
              tap_action:
                action: more-info
        sort:
          method: attribute
          attribute: filament_name
        card:
          type: grid
          columns: 2
          square: false
        card_param: cards
    - type: custom:expander-card
      title-card-clickable: true
      expanded: false
      min-width-expanded: 1024
      title-card-button-overlay: true
      expanded-gap: 1em
      padding: 0px
      child-margin-top: 0.5em
      expander-card-background: transparent
      expander-card-background-expanded: transparent
      title: PETG, ASA, TPU
      title-card:
        name: PETG, ASA, TPU
        styles:
          card:
          - padding: 2% 0px
          - font-size: 125%
          - border-radius: 0%
          - font-weight: 100
          - letter-spacing: 3px
          - --mdc-ripple-press-opacity: 0
          - cursor: initial
          name:
          - font-weight: 900
        type: custom:button-card
      cards:
      - type: custom:auto-entities
        filter:
          include:
          - integration: '*spoolman*'
            attributes:
              archived: false
            options:
              type: custom:mushroom-template-card
              vertical: false
              icon_color: '#{{ state_attr(entity, ''filament_color_hex'') }}'
              icon: mdi:printer-3d-nozzle
              badge_icon: "{% if state_attr(entity, 'archived') == true %}\n  mdi:archive\n{% elif state_attr(entity,\
                \ 'klipper_active_spool') == true %}\n  mdi:check-circle\n{% endif %}\n"
              badge_color: "{% if state_attr(entity, 'archived') == true %}\n  orange\n{% elif state_attr(entity,\
                \ 'klipper_active_spool') == true %}\n  green\n{% else %}\n  default_color\n{% endif %}\n"
              primary: "{% set location = state_attr(entity, 'location') %}\n{% if location %}\n  {{ state_attr(entity,\
                \ 'filament_name') }} ({{ location }})\n{% else %}\n  {{ state_attr(entity, 'filament_material')\
                \ }} - {{ state_attr(entity, 'filament_name') }}\n{% endif %}\n"
              secondary: '{{ (state_attr(entity, ''remaining_weight'') | float(0))  | round(2) }} g'
              tap_action:
                action: more-info
          exclude:
          - attributes:
              filament_material: PLA
        sort:
          method: attribute
          attribute: filament_material
        card:
          type: grid
          columns: 2
          square: false
        card_param: cards
  column_span: 5
header:
  layout: responsive
  badges_position: bottom
  badges_wrap: wrap
max_columns: 5
path: serverroom
