# oprit view — migrated to committed YAML (PR-15, camera/driveway).
# Inline 1:1 lift via scripts/extract_view.py. Doorbell camera via lightweight
# picture-entity/picture cards; expander-cards, button-cards, gauges,
# mushroom-climate. Stable `path: oprit` already present -> no T4/T7. No card_mod.
# PRIVACY: presence/travel-time keys carried household first names; neutralized to
# generic tokens in the logical keys only (real ids resolve from the git-ignored
# local mapping). No visible-label change -> full 0-diff round-trip vs the default.
type: sections
max_columns: 4
title: oprit
path: oprit
sections:
- type: grid
  cards:
  - type: vertical-stack
    cards:
    - type: custom:mushroom-light-card
      entity: <<oprit.schakelaar_voordeur_l1>>
      use_light_color: true
      show_brightness_control: true
      collapsible_controls: true
      icon: hue:wall-fuzo
    - card:
        cards:
        - cards:
          - entities:
            - buttons:
              - entity: <<oprit.deursensor_voordeur>>
                layout: icon|state
                state_icons:
                  'off': mdi:motion-sensor-off
                  'on': mdi:motion-sensor
                state_styles:
                  'off':
                    button:
                      border-radius: 10px
                      color: green
                  'on':
                    button:
                      border-radius: 10px
                      color: red
                state_text:
                  'off': Geen beweging
                  'on': beweging gedetecteerd
              type: custom:paper-buttons-row
            type: entities
          - entities:
            - buttons:
              - entity: <<oprit.daikin_badkamer_climatecontrol_buiten_temperatuur>>
                layout: icon|state|name
                name: °C
                styles:
                  button:
                    border-radius: 10px
                    color: green
              type: custom:paper-buttons-row
            type: entities
          columns: 2
          square: false
          type: grid
        type: vertical-stack
      type: custom:mod-card
      style: "ha-card {\n  background: var( --ha-card-background, var(--card-background-color, white)\
        \ );\n  border-radius: var(--ha-card-border-radius, 4px);\n  box-shadow: var( --ha-card-box-shadow,\
        \ 0px 2px 1px -1px rgba(0, 0, 0, 0.2), 0px 1px 1px 0px rgba(0, 0, 0, 0.14), 0px 1px 3px 0px rgba(0,\
        \ 0, 0, 0.12) );\n}\nh1 {\n  color: red !important;\n}\n"
    - type: custom:stack-in-card
      cards:
      - type: custom:mini-graph-card
        entities:
        - entity: <<oprit.daikin_badkamer_climatecontrol_buiten_temperatuur>>
          name: Temperatuur
          color: '#00bb33'
        hours_to_show: 72
        line_width: 3
        font_size: 50
        animate: true
        show:
          name: false
          icon: true
          state: false
          legend: false
          fill: fade
    - type: vertical-stack
      cards:
      - type: picture
        image:
          media_content_id: /local/images/id4_pro_1_transparent.png
      - type: custom:expander-card
        title-card-clickable: true
        expanded: true
        min-width-expanded: 1024
        title-card-button-overlay: true
        expanded-gap: 1em
        padding: 0px
        child-margin-top: 0.5em
        expander-card-background: transparent
        expander-card-background-expanded: transparent
        title: Batterij info
        title-card:
          name: Batterij info
          styles:
            card:
            - padding: 2% 0px
            - font-size: 125%
            - border-radius: 0%
            - font-weight: 100
            - letter-spacing: 3px
            - --mdc-ripple-press-opacity: 0
            - cursor: initial
            name:
            - font-weight: 900
          type: custom:button-card
        cards:
        - type: entities
          entities:
          - entity: <<oprit.nightshade_electric_range>>
            name: ID4 Actieradius
            icon: mdi:speedometer
          - entity: <<oprit.nightshade_charging_cable_connected>>
            name: Laadkabel
          - entity: <<oprit.nightshade_charging_rate>>
            name: Laadsnelheid Km/H
          - entity: <<oprit.nightshade_charging_time_left>>
            name: Resterende laadtijd
            icon: mdi:clock-end
        - type: horizontal-stack
          cards:
          - type: gauge
            entity: <<oprit.nightshade_battery_level>>
            min: 0
            max: 100
            name: Accu status
            unit: '%'
            severity:
              green: 60
              yellow: 40
              red: 20
          - type: gauge
            entity: <<oprit.nightshade_charging_power>>
            min: 0
            max: 125
            name: Laadsnelheid
            severity:
              green: 0
              yellow: 80
              red: 110
            unit: kW/H
            needle: true
- type: grid
  cards:
  - type: vertical-stack
    cards:
    - type: custom:expander-card
      title-card-clickable: true
      expanded: true
      min-width-expanded: 1024
      title-card-button-overlay: true
      expanded-gap: 1em
      padding: -2px
      child-margin-top: 0.5em
      expander-card-background: transparent
      expander-card-background-expanded: transparent
      title: Boven
      title-card:
        name: Security
        styles:
          card:
          - padding: 2% 0px
          - font-size: 125%
          - border-radius: 0%
          - font-weight: 100
          - letter-spacing: 3px
          - --mdc-ripple-press-opacity: 0
          - cursor: initial
          name:
          - font-weight: 900
        type: custom:button-card
      cards:
      - show_state: true
        show_name: true
        camera_view: live
        fit_mode: cover
        type: picture-entity
        entity: <<oprit.deurbel_high_resolution_channel>>
        image:
          media_content_id: https://demo.home-assistant.io/stub_config/bedroom.png
    - type: custom:expander-card
      title-card-clickable: true
      expanded: true
      min-width-expanded: 1024
      title-card-button-overlay: true
      expanded-gap: 1em
      padding: -2px
      child-margin-top: 0.5em
      expander-card-background: transparent
      expander-card-background-expanded: transparent
      title: Climatisering
      title-card:
        name: Climatisering
        styles:
          card:
          - padding: 2% 0px
          - font-size: 125%
          - border-radius: 0%
          - font-weight: 100
          - letter-spacing: 3px
          - --mdc-ripple-press-opacity: 0
          - cursor: initial
          name:
          - font-weight: 900
        type: custom:button-card
      cards:
      - type: picture
        image:
          media_content_id: local/images/id4_pro_transparent.png
      - type: custom:mushroom-climate-card
        entity: <<oprit.nightshade_electric_climatisation>>
        fill_container: true
        layout: horizontal
        show_temperature_control: true
        collapsible_controls: false
        hvac_modes:
        - heat_cool
        tap_action:
          action: toggle
- type: grid
  cards:
  - type: vertical-stack
    cards:
    - type: custom:expander-card
      title-card-clickable: true
      expanded: true
      min-width-expanded: 1024
      title-card-button-overlay: true
      expanded-gap: 1em
      padding: -2px
      child-margin-top: 0.5em
      expander-card-background: transparent
      expander-card-background-expanded: transparent
      title: Laadpaal
      title-card:
        name: Laadpaal
        styles:
          card:
          - padding: 2% 0px
          - font-size: 125%
          - border-radius: 0%
          - font-weight: 100
          - letter-spacing: 3px
          - --mdc-ripple-press-opacity: 0
          - cursor: initial
          name:
          - font-weight: 900
        type: custom:button-card
      cards:
      - aspect_ratio: 2.5/1.2
        color: rgb(150, 150, 150)
        entity: <<oprit.person_1_load_person_1_1>>
        entity_picture: /local/images/ev-wall.png
        icon: mdi:battery-charging
        name: Smappee laadpaal
        show_entity_picture: true
        show_state: true
        size: 30%
        type: custom:button-card
      - type: entities
        entities:
        - entity: <<oprit.person_1_load_person_1_1>>
          icon: phu:ev-charging
        - entity: <<oprit.smappee_laadpaal_kwh>>
        - entity: <<oprit.laadpaal_daily>>
        - entity: <<oprit.laadpaal_daily_eur>>
        - entity: <<oprit.laadpaal_daily_yesterday>>
          icon: mdi:counter
        - entity: <<oprit.laadpaal_daily_yesterday_eur>>
        - entity: <<oprit.laadpaal_monthly>>
        - entity: <<oprit.laadpaal_yearly>>
      - aggregate_func: max
        entities:
        - entity: <<oprit.laadpaal_daily>>
          color: '#154d32'
        group_by: date
        hours_to_show: 168
        show:
          graph: bar
        type: custom:mini-graph-card
        name: Auto vandaag geladen
    - cards:
      - type: entities
        entities:
        - entity: <<oprit.person_1_to_home>>
        - entity: <<oprit.person_1_to_work>>
        - entity: <<oprit.person_1_to_school_kind>>
        - entity: <<oprit.person_2_to_home>>
        - entity: <<oprit.person_2_to_work>>
        - entity: <<oprit.person_2_to_person_1>>
        title: Waze travel times
      type: vertical-stack
badges:
- type: custom:decluttering-card
  template: global_navigation_badges
header:
  layout: responsive
  badges_position: bottom
  badges_wrap: scroll
