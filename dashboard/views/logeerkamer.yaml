# logeerkamer view — migrated to committed YAML (PR-09).
# Inline 1:1 lift via scripts/extract_view.py. The light card + paper-buttons grid
# stay bespoke, but the temp/humidity and CO2 mini-graph blocks are shared verbatim
# with slaapkamer/kinderkamer and now delegate to the `sensor_graph_mini` /
# `air_quality_mini` decluttering templates (PR-D). One deliberate change:
# a stable `path: logeerkamer` is added (T4 — the default view had none, giving
# it a fragile numeric render path). card_mod kept verbatim (theme-token pass is
# PR-38). Real IDs resolve from the git-ignored entities.local.yaml.
theme: Juiced Horizon
title: logeerkamer
path: logeerkamer
type: sections
badges:
- type: custom:decluttering-card
  template: global_navigation_badges
cards: []
sections:
- type: grid
  cards:
  - type: vertical-stack
    cards:
    - type: custom:mushroom-light-card
      entity: <<logeerkamer.schakelaar_logeerkamer_left>>
      use_light_color: true
    - type: custom:mushroom-cover-card
      entity: <<logeerkamer.rolluik_logeerkamer>>
      show_position_control: true
      show_buttons_control: true
      show_tilt_position_control: false
    - control:
      - hvac
      - preset
      - fan
      - swing
      entity: <<logeerkamer.daikin_logeerkamer_room_temperature>>
      header: false
      label:
        temperature: temperatuur
      hide:
        state: true
        temperature: false
      layout:
        mode:
          headings: false
          icons: true
          names: true
        sensors:
          labels: true
        step: row
      type: custom:simple-thermostat
  - type: vertical-stack
    cards:
    - type: vertical-stack
      cards:
      - card_mod:
          style: "ha-card {\n  --restriction-lock-row-margin-left: 82%;\n  --restriction-regular-lock-color:\
            \ #13269e\n}\n"
        entities:
        - entity: <<logeerkamer.daikin_logeerkamer_climatecontrol_dagelijks_elektriciteitsverbruik_koelen>>
          name: Dagelijks Verbruik Koelen
        - entity: <<logeerkamer.daikin_logeerkamer_climatecontrol_dagelijks_elektriciteitsverbruik_verwarmen>>
          name: Dagelijks Verbruik Verwarmen
        - entity: <<logeerkamer.daikin_logeerkamer_climatecontrol_maandelijks_elektriciteitsverbruik_koelen>>
          name: Maandelijks Verbruik Koelen
        - entity: <<logeerkamer.daikin_logeerkamer_climatecontrol_maandelijks_elektriciteitsverbruik_verwarmen>>
          name: Maandelijks Verbruik verwarmen
        - entity: <<logeerkamer.daikin_logeerkamer_climatecontrol_jaarlijks_elektriciteitsverbruik_koelen>>
          name: Jaarlijks Verbruik Koelen
        - entity: <<logeerkamer.daikin_logeerkamer_climatecontrol_jaarlijks_elektriciteitsverbruik_verwarmen>>
          name: Jaarlijks Verbruik verwarmen
        state_color: true
        title: Airco Logeerkamer
        type: entities
      - aggregate_func: max
        entities:
        - <<logeerkamer.daikin_logeerkamer_climatecontrol_dagelijks_elektriciteitsverbruik_verwarmen>>
        - <<logeerkamer.daikin_logeerkamer_climatecontrol_dagelijks_elektriciteitsverbruik_koelen>>
        group_by: date
        hours_to_show: 168
        show:
          graph: bar
        type: custom:mini-graph-card
  - type: vertical-stack
    cards:
    - type: custom:decluttering-card
      template: sensor_graph_mini
      variables:
      - temp_entity: <<logeerkamer.ht_logeerkamer_temperatuur>>
      - humidity_entity: <<logeerkamer.ht_logeerkamer_luchtvochtigheid>>
    - type: custom:decluttering-card
      template: air_quality_mini
      variables:
      - co2_entity: <<logeerkamer.ht_logeerkamer_kooldioxide>>
    - card:
        cards:
        - cards:
          - entities:
            - buttons:
              - entity: <<logeerkamer.ht_logeerkamer_temperatuur>>
                layout: icon|state|name
                name: °C
                styles:
                  button:
                    border-radius: 10px
                    color: green
              type: custom:paper-buttons-row
            type: entities
          - entities:
            - buttons:
              - entity: <<logeerkamer.ht_logeerkamer_luchtvochtigheid>>
                layout: icon|state|name
                name: '%'
                styles:
                  button:
                    border-radius: 10px
                    color: green
              type: custom:paper-buttons-row
            type: entities
          - entities:
            - buttons:
              - entity: <<logeerkamer.ht_logeerkamer_kooldioxide>>
                layout: icon|state|name
                icon: mdi:molecule-co2
                name: ppm
                styles:
                  button:
                    border-radius: 10px
                    color: green
              type: custom:paper-buttons-row
            type: entities
          - entities:
            - buttons:
              - entity: <<logeerkamer.raamsensor_logeerkamer_licht>>
                layout: icon|state|name
                icon: mdi:brightness-5
                name: lux
                styles:
                  button:
                    border-radius: 10px
                    color: green
              type: custom:paper-buttons-row
            type: entities
          - entities:
            - buttons:
              - entity: <<logeerkamer.raamsensor_logeerkamer_raam>>
                layout: icon|state
                state_icons:
                  'off': mdi:window-closed
                  'on': mdi:window-open
                state_styles:
                  'off':
                    button:
                      color: green
                  'on':
                    button:
                      color: red
                state_text:
                  'off': raam gesloten
                  'on': raam open
                name: ''
                styles:
                  button:
                    border-radius: 10px
                    color: green
              type: custom:paper-buttons-row
            type: entities
          - entities:
            - buttons:
              - entity: <<logeerkamer.raamsensor_logeerkamer_rotation>>
                layout: icon|state|name
                name: °
                icon: mdi:rotate-3d
                styles:
                  button:
                    border-radius: 10px
                    color: green
              type: custom:paper-buttons-row
            type: entities
          - entities:
            - attribute: battery_percent
              critical: 25
              entity: <<logeerkamer.ht_logeerkamer_batterij>>
              name: Binnenmodule
              type: custom:battery-entity-row
              unit: '%'
              warning: 50
            type: entities
          - entities:
            - attribute: battery_percent
              critical: 25
              entity: <<logeerkamer.raamsensor_logeerkamer_batterij>>
              name: raam
              type: custom:battery-entity-row
              unit: '%'
              warning: 50
            type: entities
          columns: 2
          square: false
          type: grid
        type: vertical-stack
      type: custom:mod-card
      style: "ha-card {\n  background: var( --ha-card-background, var(--card-background-color, white)\
        \ );\n  border-radius: var(--ha-card-border-radius, 4px);\n  box-shadow: var( --ha-card-box-shadow,\
        \ 0px 2px 1px -1px rgba(0, 0, 0, 0.2), 0px 1px 1px 0px rgba(0, 0, 0, 0.14), 0px 1px 3px 0px rgba(0,\
        \ 0, 0, 0.12) );\n}\nh1 {\n  color: red !important;\n}\n"
  column_span: 3
header:
  layout: responsive
  badges_position: bottom
  badges_wrap: wrap
