# keuken view — migrated to committed YAML (PR-16).
# Inline 1:1 lift via scripts/extract_view.py. Stable `path: keuken` present ->
# no T4/T7 refactor. card_mod kept verbatim (theme-token pass is PR-38). Any
# household-name keys are neutralized to generic tokens (real ids resolve from
# the git-ignored entities.local.yaml).
theme: Juiced Horizon
type: sections
max_columns: 4
title: keuken
path: keuken
sections:
- type: grid
  cards:
  - type: vertical-stack
    cards:
    - type: horizontal-stack
      cards:
      - type: custom:mushroom-light-card
        entity: <<keuken.ledstrip_keukeneiland_1>>
        use_light_color: true
        show_brightness_control: true
        collapsible_controls: true
        name: keukeneiland
      - type: custom:mushroom-light-card
        entity: <<keuken.ledstrip_keuken_1>>
        name: keukenkasten
        use_light_color: true
        show_brightness_control: true
        collapsible_controls: true
    - type: horizontal-stack
      cards:
      - type: custom:mushroom-light-card
        entity: <<keuken.ledstrip_koffiezet_1>>
        use_light_color: true
        show_brightness_control: true
        collapsible_controls: true
        name: Koffienis
      - type: custom:mushroom-light-card
        entity: <<keuken.licht_bijkeuken>>
        use_light_color: true
        fill_container: true
        name: Bijkeuken
    - type: custom:mushroom-cover-card
      entity: <<keuken.rolluik_keuken>>
      show_position_control: true
      show_tilt_position_control: false
      show_buttons_control: true
      tap_action:
        action: more-info
    - type: custom:mini-media-player
      entity: <<keuken.keuken>>
      group: false
      volume_stateless: false
      toggle_power: true
      source: icon
      artwork: cover
      sound_mode: icon
      info: scroll
      speaker_group:
        platform: sonos
        show_group_count: true
        entities:
        - entity_id: <<keuken.keuken>>
          name: Sonos keuken
        - entity_id: <<keuken.living>>
          name: Sonos Living
        - entity_id: <<keuken.kantoor>>
          name: Sonos kantoor
        - entity_id: <<keuken.badkamer>>
          name: Sonos badkamer
        - entity_id: <<keuken.slaapkamer>>
          name: Sonos Slaapkamer
        - entity_id: <<keuken.bbq_buitenkeuken>>
          name: Sonos BBQ buitenkeuken
        - entity_id: <<keuken.tuinhuis>>
          name: Sonos Tuinhuis
    - type: custom:expander-card
      title-card-clickable: true
      expanded: true
      min-width-expanded: 1024
      title-card-button-overlay: true
      expanded-gap: 1em
      padding: 0px
      child-margin-top: 0.5em
      expander-card-background: transparent
      expander-card-background-expanded: transparent
      title: Buiten
      title-card:
        name: We Earth 2.0
        styles:
          card:
          - padding: 2% 0px
          - font-size: 125%
          - border-radius: 0%
          - font-weight: 100
          - letter-spacing: 3px
          - --mdc-ripple-press-opacity: 0
          - cursor: initial
          name:
          - font-weight: 900
        type: custom:button-card
      cards:
      - square: false
        type: grid
        cards:
        - type: picture
          image:
            media_content_id: media-source://media_source/local/weearth.jpg
            media_content_type: image/jpeg
            metadata:
              title: weearth.jpg
              thumbnail: null
              media_class: image
              children_media_class: null
              navigateIds:
              - {}
              - media_content_type: app
                media_content_id: media-source://media_source
        - type: custom:restriction-card
          card:
            type: custom:mushroom-entity-card
            entity: <<keuken.weearth>>
            name: We Earth 2.0
            icon_color: primary
            icon: mdi:compost
            layout: vertical
            fill_container: true
          restrictions:
            lock: true
        - type: custom:mushroom-entity-card
          icon_color: primary
          icon: mdi:compost
          layout: vertical
          entity: <<keuken.weearth_actief>>
          fill_container: true
        columns: 3
