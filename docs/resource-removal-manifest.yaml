# Resource-removal manifest — EXECUTED 2026-08-26 (owner-authorized live removal).
#
# Companion to docs/resource-audit.md. Lists the frontend resources that were
# VERIFIED unused across ALL dashboards (see `verification:` below) and have now
# been removed from the live global resource registry (53 -> 43 resources, ~2.1 MB).
# `ha_config_delete_dashboard_resource` is a GLOBAL registry change that also affects
# the default dashboard, so this was gated on explicit owner approval (given at the
# theme/cutover step) — the one deliberate exception to the "writes only to
# mcp-test-dashboard" rule.
#
# Per resource:
#   remove   -> ha_config_delete_dashboard_resource(resource_id=<id>)   [DONE]
#   rollback -> ha_config_set_dashboard_resource(url=<url>, resource_type=module)
#              (canonical rollback is via HACS, which owns the /hacsfiles/ files;
#               removal only unregisters — the /hacsfiles/ files are untouched)

